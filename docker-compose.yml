version: '3.8'

# 1. Creates the Shared Network
networks:
  hosting_net:
    name: hosting_net
    driver: bridge

services:
  # 2. Permanent Gateway (Nginx Proxy Manager)
  nginx_proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./data/npm-data:/data
      - ./data/npm-letsencrypt:/etc/letsencrypt
    networks:
      - hosting_net
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:81"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 3. Permanent Dashboard (Portainer)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer-data:/data
    networks:
      - hosting_net