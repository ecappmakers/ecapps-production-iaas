name: 🗄️ Daily Backup (Scripted)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - production

jobs:
  backup:
    name: 🛡️ Secure Database Backup
    runs-on: ubuntu-latest
    
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Install Tooling
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash

      - name: 📦 SSH Database Dump
        uses: appleboy/ssh-action@master
        env:
          DB_PASS: ${{ secrets.DB_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_PASS
          script_stop: true
          connect_timeout: 5m
          command_timeout: 15m
          script: |
            set -euo pipefail
            BACKUP_DIR="/tmp/db_staging"
            mkdir -p "$BACKUP_DIR"
            docker exec main_db mysqldump -u root -p"$DB_PASS" --all-databases | gzip > "${BACKUP_DIR}/db_$(date +%F).sql.gz"

      - name: ⬇️ Download to Runner
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh temp_backups
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          scp -o ConnectTimeout=300 -i ~/.ssh/id_rsa "$VPS_USER@$VPS_HOST:/tmp/db_staging/*.sql.gz" temp_backups/

      - name: 🗑️ Wipe VPS Local Copy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: rm -rf /tmp/db_staging

      - name: ☁️ Upload & Fetch History
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG }}
        run: |
          echo "$RCLONE_CONF" > rclone.conf
          # Upload
          rclone --config rclone.conf copy temp_backups gdrive:/VPS_Backups/MySQL
          # Fetch JSON and PIPE into our Python script
          rclone --config rclone.conf lsjson gdrive:/VPS_Backups/MySQL | python3 scripts/process_backups.py

      - name: 📧 Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "💾 Backup Report - ${{ github.repository }}"
          to: ecappmakersonline@gmail.com,raajbala1999@gmail.com
          from: "GitHub Actions <${{ secrets.EMAIL_USER }}>"
          html_body: |
            <h3>Backup History</h3>
            <ul>${{ env.HISTORICAL_HTML }}</ul>
          attachments: temp_backups/*.sql.gz

      - name: 📱 Telegram Notification
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Safe URL Encoding for Telegram
          HEADER="<b>📊 Backup Report</b>%0A──────────────────%0A"
          FOOTER="──────────────────%0A✅ <b>Status:</b> ${{ job.status }}"
          
          python3 -c "import os, urllib.parse; print(urllib.parse.quote(os.environ.get('HISTORICAL_TEXT', '')))" > encoded.txt
          
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d parse_mode="HTML" \
            -d text="${HEADER}$(cat encoded.txt)${FOOTER}" \
            -d disable_web_page_preview="true"