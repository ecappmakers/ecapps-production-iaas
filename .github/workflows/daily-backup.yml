name: 🗄️ Daily Backup (Cloud Only)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: 🛡️ Secure Database Backup
    runs-on: ubuntu-latest
    
    steps:
      - name: 📦 SSH Database Dump
        uses: appleboy/ssh-action@master
        env:
          DB_PASS: ${{ secrets.DB_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_PASS
          script_stop: true
          script: |
            set -euo pipefail
            BACKUP_DIR="/tmp/db_staging"
            DATE_STAMP=$(date +%F)
            FILE_PATH="${BACKUP_DIR}/db_${DATE_STAMP}.sql.gz"
            mkdir -p "$BACKUP_DIR"
            docker exec main_db mysqldump -u root -p"$DB_PASS" --all-databases | gzip > "$FILE_PATH"

      - name: ⬇️ Download to Runner
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh temp_backups
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/id_rsa "$VPS_USER@$VPS_HOST:/tmp/db_staging/*.sql.gz" temp_backups/

      - name: 🗑️ Wipe VPS Local Copy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: rm -rf /tmp/db_staging

      - name: ☁️ Upload to Google Drive
        uses: wei/rclone@v1
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG }}
        with:
          args: copy temp_backups gdrive:/VPS_Backups/MySQL

      - name: 📑 Fetch Historical Metadata
        shell: bash
        run: |
          # Fetch JSON metadata for all files in the folder
          # Note: This requires your rclone config to have sufficient scopes to read URLs
          RAW_JSON=$(rclone --config <(echo "${{ secrets.RCLONE_CONFIG }}") lsjson gdrive:/VPS_Backups/MySQL --hash)
          
          # Generate HTML list for Email
          echo "HISTORICAL_HTML<<EOF" >> $GITHUB_ENV
          echo "$RAW_JSON" | jq -r '.[] | "<li><a href=\"https://drive.google.com/open?id=\(.ID)\">\(.Name)</a> - \((.Size/1024/1024) | printf(\"%.2f\")) MB (Uploaded: \(.ModTime | split(\".\")[0]))</li>"' >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # Generate Text list for Telegram
          echo "HISTORICAL_TEXT<<EOF" >> $GITHUB_ENV
          echo "$RAW_JSON" | jq -r '.[] | "📄 <a href=\"https://drive.google.com/open?id=\(.ID)\">\(.Name)</a>\n📅 \(.ModTime | split(\".\")[0])\n⚖️ \((.Size/1024/1024) | printf(\"%.2f\")) MB\n"' >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 📧 Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "💾 Backup History Report - ${{ github.repository }}"
          to: ecappmakersonline@gmail.com,raajbala1999@gmail.com
          from: "GitHub Actions <${{ secrets.EMAIL_USER }}>"
          html_body: |
            <h3>Full Backup History (Google Drive)</h3>
            <p>The latest backup has been uploaded and the VPS staging area has been cleared.</p>
            <hr>
            <ul>
              ${{ env.HISTORICAL_HTML }}
            </ul>
            <hr>
            <p><em>Links lead directly to the Google Drive file viewer.</em></p>
          attachments: temp_backups/*.sql.gz

      - name: 📱 Telegram Notification
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT="<b>📊 Historical Backup Report</b>%0A"
          TEXT="${TEXT}──────────────────%0A"
          TEXT="${TEXT}$HISTORICAL_TEXT"
          TEXT="${TEXT}──────────────────%0A"
          TEXT="${TEXT}✅ <b>Status:</b> ${{ job.status }}"

          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d parse_mode="HTML" \
            -d text="$TEXT" \
            -d disable_web_page_preview="true"
