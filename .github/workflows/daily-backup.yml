name: 🗄️ Daily Backup (Cloud Only)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: 🛡️ Secure Database Backup
    runs-on: ubuntu-latest
    
    steps:
      - name: 🛠️ Install Tooling
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash
          sudo apt-get install -y jq

      - name: 📦 SSH Database Dump
        uses: appleboy/ssh-action@master
        env:
          DB_PASS: ${{ secrets.DB_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_PASS
          script_stop: true
          script: |
            set -euo pipefail
            BACKUP_DIR="/tmp/db_staging"
            DATE_STAMP=$(date +%F)
            FILE_PATH="${BACKUP_DIR}/db_${DATE_STAMP}.sql.gz"
            mkdir -p "$BACKUP_DIR"
            docker exec main_db mysqldump -u root -p"$DB_PASS" --all-databases | gzip > "$FILE_PATH"

      - name: ⬇️ Download to Runner
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh temp_backups
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/id_rsa "$VPS_USER@$VPS_HOST:/tmp/db_staging/*.sql.gz" temp_backups/

      - name: 🗑️ Wipe VPS Local Copy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: rm -rf /tmp/db_staging

      - name: ☁️ Upload to Google Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG }}
        run: |
          echo "$RCLONE_CONF" > rclone.conf
          rclone --config rclone.conf copy temp_backups gdrive:/VPS_Backups/MySQL

      - name: 📑 Fetch Historical Metadata
        shell: bash
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG }}
        run: |
          echo "$RCLONE_CONF" > rclone.conf
          
          # Fetch JSON metadata
          rclone --config rclone.conf lsjson gdrive:/VPS_Backups/MySQL > history.json
          
          # Create JQ filters in files to avoid shell quoting issues
          echo '.[] | "<li><a href=\"https://drive.google.com/open?id=\(.ID)\">\(.Name)</a> - \((.Size/1024/1024) | printf(\"%.2f\")) MB (Uploaded: \(.ModTime | split(\"T\")[0]))</li>"' > filter_html.jq
          echo '.[] | "📄 <a href=\"https://drive.google.com/open?id=\(.ID)\">\(.Name)</a>\n📅 \(.ModTime | split(\"T\")[0])\n⚖️ \((.Size/1024/1024) | printf(\"%.2f\")) MB\n"' > filter_text.jq

          # Generate outputs using the filter files
          {
            echo "HISTORICAL_HTML<<DELIM"
            jq -r -f filter_html.jq history.json
            echo "DELIM"
          } >> "$GITHUB_ENV"

          {
            echo "HISTORICAL_TEXT<<DELIM"
            jq -r -f filter_text.jq history.json
            echo "DELIM"
          } >> "$GITHUB_ENV"

      - name: 📧 Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "💾 Backup History Report - ${{ github.repository }}"
          to: ecappmakersonline@gmail.com,raajbala1999@gmail.com
          from: "GitHub Actions <${{ secrets.EMAIL_USER }}>"
          html_body: |
            <h3>Full Backup History (Google Drive)</h3>
            <p>Latest backup status: <b>${{ job.status }}</b></p>
            <hr>
            <ul>
              ${{ env.HISTORICAL_HTML }}
            </ul>
          attachments: temp_backups/*.sql.gz

      - name: 📱 Telegram Notification
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Use a variable to store the history and avoid shell expansion errors
          HISTORY=$(cat << 'EOF'
          ${{ env.HISTORICAL_TEXT }}
          EOF
          )
          
          TEXT="<b>📊 Historical Backup Report</b>%0A"
          TEXT="${TEXT}──────────────────%0A"
          
          if [ -z "$HISTORY" ]; then
            TEXT="${TEXT}<i>No historical files found.</i>%0A"
          else
            # Append history and handle URL encoding for the Telegram API
            TEXT="${TEXT}${HISTORY// /%20}"
          fi
          
          TEXT="${TEXT}──────────────────%0A"
          TEXT="${TEXT}✅ <b>Status:</b> ${{ job.status }}"

          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d parse_mode="HTML" \
            -d text="$TEXT" \
            -d disable_web_page_preview="true"
