name: 🗄️ Daily Backup

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Dump
        uses: appleboy/ssh-action@master
        env: { DB_PASS: "${{ secrets.DB_ROOT_PASSWORD }}" }
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_PASS
          script: |
             DIR="/opt/ecapps-hosting/backups"
             mkdir -p $DIR
             FILE="db_$(date +%F).sql.gz"
             # Supports MariaDB (main_db)
             if docker ps | grep -q main_db; then
                docker exec main_db mysqldump -u root -p$DB_PASS --all-databases | gzip > "$DIR/$FILE"
                find $DIR -name "*.sql.gz" -mtime +2 -delete
             else
                exit 1
             fi

      - name: Download to Runner
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh temp_backups
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
          # Downloads the backup so we can attach it
          scp -i ~/.ssh/id_rsa $VPS_USER@$VPS_HOST:/opt/ecapps-hosting/backups/*.sql.gz temp_backups/

      - name: Upload to GDrive
        uses: wei/rclone@v1
        env: { RCLONE_CONF: "${{ secrets.RCLONE_CONFIG }}" }
        with:
          args: copy temp_backups gdrive:/VPS_Backups/MySQL

      - name: Email & Notify
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: 💾 DB Backup - ${{ github.repository }}
          # 📧 DUAL RECIPIENTS
          to: ecappmakersonline@gmail.com,raajbala1999@gmail.com
          from: ${{ secrets.EMAIL_USER }}
          body: "Backup uploaded to Google Drive: VPS_Backups/MySQL"
          # 📎 ATTACHMENT
          attachments: temp_backups/*.sql.gz

      - name: Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          # ⚠️ REPLACE WITH YOUR REAL DRIVE FOLDER LINK
          LINK: "https://drive.google.com/drive/folders/1uqzVpVozguaysN5nl0Dg2FdYVoqQisbe"
        run: |
          [ "$STATUS" == "success" ] && M="✅ Backup Sent" || M="❌ Backup Failed"
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" -d parse_mode="HTML" -d text="$M%0A<a href='$LINK'>Open Drive</a>"