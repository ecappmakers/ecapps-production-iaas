name: 🗄️ Backup to GDrive + Email

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC
  workflow_dispatch:

jobs:
  backup-process:
    name: 💾 Backup -> Cloud -> Notify
    runs-on: ubuntu-latest
    steps:
      # 1. SSH into VPS & Create Dump
      - name: Create Backup on VPS
        uses: appleboy/ssh-action@master
        env:
          DB_PASS: ${{ secrets.DB_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_PASS
          script: |
            BASE="/opt/ecapps-hosting"
            BACKUP_DIR="$BASE/backups"
            mkdir -p $BACKUP_DIR
            
            DATE=$(date +%Y-%m-%d)
            FILENAME="db_$DATE.sql.gz"
            
            # Create Backup
            if docker ps | grep -q main_db; then
                docker exec main_db mysqldump -u root --password=$DB_PASS --all-databases \
                | gzip > "$BACKUP_DIR/$FILENAME"
                
                # Cleanup old files on VPS (Keep only last 2 days)
                find $BACKUP_DIR -name "*.sql.gz" -mtime +2 -delete
                echo "✅ Backup created: $FILENAME"
            else
                echo "❌ Database container not found"
                exit 1
            fi

      # 2. Download to Runner (FIXED: Using manual SCP instead of Action)
      - name: Download Backup to Runner
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # A. Setup SSH Key securely
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
          
          # B. Create Local Folder
          mkdir -p temp_backups
          
          # C. Download Files (Remote -> Local)
          # We use scp to pull files from the VPS path to our local temp folder
          scp -i ~/.ssh/id_rsa $VPS_USER@$VPS_HOST:/opt/ecapps-hosting/backups/*.sql.gz temp_backups/
          
          echo "✅ Files downloaded:"
          ls -lh temp_backups/

      # 3. Upload to Google Drive
      - name: Upload to GDrive
        id: gdrive
        uses: wei/rclone@v1
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG }}
        with:
          # Note: Source path is simpler now ("temp_backups")
          args: copy temp_backups gdrive:/VPS_Backups/MySQL

      # 4. Send Email with Attachment
      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: 💾 Database Backup - ${{ github.repository }}
          to: ecappmakersonline@gmail.com
          from: ${{ secrets.EMAIL_USER }}
          body: |
            Backup successful!
            
            📂 Stored in Google Drive: VPS_Backups/MySQL
            📅 Date: $(date)
          # Attach the file we just downloaded
          attachments: temp_backups/*.sql.gz

      # 5. Notify Telegram
      - name: Notify Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          # Replace with your actual Drive Link
          GDRIVE_LINK: "https://drive.google.com/drive/folders/YOUR_FOLDER_ID" 
        run: |
          if [ "$STATUS" == "success" ]; then
             MSG="✅ <b>Backup Successful</b>%0A%0A📧 Email sent to Admin%0A☁️ <a href='$GDRIVE_LINK'>Open Google Drive</a>"
          else
             MSG="❌ <b>Backup Failed</b>%0ACheck GitHub Actions logs."
          fi
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" -d parse_mode="HTML" -d text="$MSG"