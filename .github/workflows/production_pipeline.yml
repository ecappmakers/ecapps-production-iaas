name: 🚀 Production Deployment Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - production
    paths:
      - apps.json
      - docker-compose.yml
      - .github/workflows/**

permissions:
  contents: read
  packages: write

jobs:

  # ======================================================
  # 1. PLAN & DETECT
  # ======================================================
  plan:
    name: 🧭 Plan & Detect Applications (Matrix Builder)
    runs-on: ubuntu-latest

    outputs:
      matrix_containers: ${{ steps.set-matrix.outputs.containers }}
      has_containers: ${{ steps.set-matrix.outputs.has_containers }}
      matrix_statics: ${{ steps.set-matrix.outputs.statics }}
      has_statics: ${{ steps.set-matrix.outputs.has_statics }}

    steps:
      - name: 📥 Checkout Pipeline Repository
        uses: actions/checkout@v3

      - name: 🧮 Analyze apps.json & Generate Matrices
        id: set-matrix
        run: |
          set -e
          echo "==== APPLICATION DISCOVERY ====" | tee -a build.log

          if [ ! -f apps.json ]; then
            echo "❌ apps.json missing" | tee -a build.log
            exit 1
          fi

          CONTAINERS=$(jq -c '{include: [.apps[] | select(.type | ascii_downcase | test("container|backend")) | . + {repo_url: (.repo_url // .repo)}]}' apps.json)
          STATICS=$(jq -c '{include: [.apps[] | select(.type | ascii_downcase | test("static|node")) | . + {repo_url: (.repo_url // .repo)}]}' apps.json)

          COUNT_C=$(echo "$CONTAINERS" | jq '.include | length')
          COUNT_S=$(echo "$STATICS" | jq '.include | length')

          echo "📦 Containers: $COUNT_C" | tee -a build.log
          echo "⚡ Statics   : $COUNT_S" | tee -a build.log

          echo "containers=$CONTAINERS" >> "$GITHUB_OUTPUT"
          echo "statics=$STATICS" >> "$GITHUB_OUTPUT"

          [ "$COUNT_C" -gt 0 ] && echo "has_containers=true" >> "$GITHUB_OUTPUT" || echo "has_containers=false" >> "$GITHUB_OUTPUT"
          [ "$COUNT_S" -gt 0 ] && echo "has_statics=true" >> "$GITHUB_OUTPUT" || echo "has_statics=false" >> "$GITHUB_OUTPUT"

  # ======================================================
  # 2. BUILD CONTAINERS
  # ======================================================
  build-containers:
    name: 🐳 Build & Publish Container · ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    if: ${{ needs.plan.outputs.has_containers == 'true' }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix_containers || '{"include":[]}') }}

    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v3
        with:
          repository: ${{ matrix.repo_url }}
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GH_PAT }}

      - name: 🏷 Resolve Image Namespace
        id: meta
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔨 Build & Push Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.name }}:latest

      - name: 📝 Record Result
        run: echo "🐳 ${{ matrix.name }} (Container)" | tee -a built_apps.txt build.log

      - name: 📤 Upload Container Log
        uses: actions/upload-artifact@v4
        with:
          name: log-container-${{ matrix.name }}
          path: built_apps.txt

  # ======================================================
  # 3. BUILD STATIC SITES
  # ======================================================
  build-static:
    name: ⚡ Build Static Site · ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    if: ${{ needs.plan.outputs.has_statics == 'true' }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix_statics || '{"include":[]}') }}

    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v3
        with:
          repository: ${{ matrix.repo_url }}
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GH_PAT }}
          path: source_code

      - name: 🔨 Build Static Site
        run: |
          set -e
          echo "==== STATIC BUILD: ${{ matrix.name }} ====" | tee -a build.log

          mkdir -p output
          cd source_code

          eval "${{ matrix.build_cmd }}"

          if [ ! -d "${{ matrix.output_dir }}" ]; then
            echo "❌ Output directory missing" | tee -a build.log
            exit 1
          fi

          cp -r "${{ matrix.output_dir }}"/. ../output/
          echo "⚡ ${{ matrix.name }} (Static)" | tee -a ../built_static.txt ../build.log

      - name: 📤 Upload Static Artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site-${{ matrix.name }}
          path: output

      - name: 📤 Upload Static Log
        uses: actions/upload-artifact@v4
        with:
          name: log-static-${{ matrix.name }}
          path: built_static.txt

  # ======================================================
  # 4. DEPLOY TO VPS
  # ======================================================
  deploy:
    name: 🚀 Deploy Infrastructure & Applications (VPS)
    needs:
      - plan
      - build-containers
      - build-static
    runs-on: ubuntu-latest
    if: ${{ always() && !contains(needs['build-containers'].result, 'failure') && !contains(needs['build-static'].result, 'failure') }}

    steps:
      - name: 📥 Checkout Deployment Files
        uses: actions/checkout@v3

      - name: 📤 Upload Infra Files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml,apps.json
          target: /opt/ecapps-hosting/

      - name: 🔄 Generate & Apply Infrastructure
        uses: appleboy/ssh-action@master
        env:
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DB_PASS: ${{ secrets.DB_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_USER,GH_TOKEN,DB_PASS
          script: |
            set -e
            echo "==== VPS DEPLOYMENT START ====" | tee -a build.log

            BASE="/opt/ecapps-hosting"
            mkdir -p "$BASE/data/sites" "$BASE/data/mysql" "$BASE/data/init_sql" "$BASE/data/apache"
            cd "$BASE"

            echo "📝 Generating Apache VHosts" | tee -a build.log
            VHOST_FILE="$BASE/data/apache/vhosts.conf"
            echo "# Auto-generated $(date)" > "$VHOST_FILE"

            for row in $(jq -r '.apps[] | select(.type | ascii_downcase | test("static|node")) | @base64' apps.json); do
              _jq() { echo "$row" | base64 --decode | jq -r "$1"; }
              DOMAIN=$(_jq '.domain')
              [ "$DOMAIN" != "null" ] && [ -n "$DOMAIN" ] && cat <<EOVHOST >> "$VHOST_FILE"
<VirtualHost *:80>
  ServerName ${DOMAIN}
  ServerAlias www.${DOMAIN}
  DocumentRoot /var/www/html/${DOMAIN}
  <Directory /var/www/html/${DOMAIN}>
    AllowOverride All
    Require all granted
    FallbackResource /index.html
  </Directory>
</VirtualHost>

EOVHOST
            done

            echo "🐳 Generating docker-compose overlay" | tee -a build.log
            LOWER_USER=$(echo "$GH_USER" | tr '[:upper:]' '[:lower:]')
            echo "$GH_TOKEN" | docker login ghcr.io -u "$LOWER_USER" --password-stdin

            cat > docker-compose.prod.yml <<EOF
version: "3.8"
services:
  shared_web:
    image: php:8.1-apache
    restart: always
    volumes:
      - "./data/sites:/var/www/html"
      - "./data/apache/vhosts.conf:/etc/apache2/sites-enabled/000-default.conf"
    networks: [hosting_net]
    command: /bin/sh -c "a2enmod headers rewrite && apache2-foreground"

  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: $DB_PASS
    volumes:
      - "./data/mysql:/var/lib/mysql"
      - "./data/init_sql:/docker-entrypoint-initdb.d"
    networks: [hosting_net]
EOF

            for row in $(jq -r '.apps[] | select(.type | ascii_downcase | test("container|backend")) | @base64' apps.json); do
              _jq() { echo "$row" | base64 --decode | jq -r "$1"; }
              NAME=$(_jq '.name')
              cat >> docker-compose.prod.yml <<EOF
  $NAME:
    image: ghcr.io/$LOWER_USER/$NAME:latest
    restart: always
    networks: [hosting_net]
    environment:
EOF
              echo "$row" | base64 --decode | jq -r '.env | to_entries[] | "      \(.key)=\(.value)"' \
                | sed "s/DB_ROOT_PASSWORD/$DB_PASS/" >> docker-compose.prod.yml
            done

            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

  # ======================================================
  # 5. CONFIGURE PROXY
  # ======================================================
  configure-proxy:
    name: 🌐 Configure Nginx Proxy Manager
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ always() && !contains(needs.deploy.result, 'failure') }}

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - run: pip install requests
      - run: python .github/scripts/configure_npm.py 2>&1 | tee -a build.log npm_log.txt

      - uses: actions/upload-artifact@v4
        with:
          name: log-npm
          path: npm_log.txt

  # ======================================================
  # 6. NOTIFICATIONS
  # ======================================================
  notify:
    name: 🔔 Notify · Deployment Summary
    needs:
      - deploy
      - configure-proxy
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download Logs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: log-*
          path: logs
          merge-multiple: true

      - name: 🧠 Build Notification Payload
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PROXY_RESULT: ${{ needs.configure-proxy.result }}
        run: |
          set -e
          STATUS="failure"
          EMOJI="❌"
          TITLE="Deployment Failed"

          if [ "$DEPLOY_RESULT" = "success" ] && { [ "$PROXY_RESULT" = "success" ] || [ "$PROXY_RESULT" = "skipped" ]; }; then
            STATUS="success"
            EMOJI="✅"
            TITLE="Deployment Successful"
          fi

          echo "STATUS=$STATUS" >> "$GITHUB_ENV"
          echo "EMOJI=$EMOJI" >> "$GITHUB_ENV"
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"

      - name: 📤 Upload Full Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
