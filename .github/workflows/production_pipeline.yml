name: 🚀 Production Deployment Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - production
    paths:
      - apps.json
      - docker-compose.yml
      - .github/workflows/**

permissions:
  contents: read
  packages: write

jobs:

  # ======================================================
  # 1. PLAN & DETECT
  # ======================================================
  plan:
    name: 🧭 Plan & Detect Applications
    runs-on: ubuntu-latest
    outputs:
      matrix_containers: ${{ steps.set-matrix.outputs.containers }}
      has_containers: ${{ steps.set-matrix.outputs.has_containers }}
      matrix_statics: ${{ steps.set-matrix.outputs.statics }}
      has_statics: ${{ steps.set-matrix.outputs.has_statics }}
      matrix_databases: ${{ steps.set-matrix.outputs.databases }}
      has_databases: ${{ steps.set-matrix.outputs.has_databases }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: 🧮 Analyze apps.json
        id: set-matrix
        run: |
          set -e
          echo "==== 🔍 APPLICATION DISCOVERY ====" | tee -a build.log

          if [ ! -f apps.json ]; then
            echo "❌ CRITICAL: apps.json missing" | tee -a build.log
            exit 1
          fi

          # Logic: Maps 'repo' -> 'repo_url' and handles types case-insensitively
          CONTAINERS=$(jq -c '{include: [.apps[] | select(.type | ascii_downcase | test("container|backend")) | . + {repo_url: (.repo_url // .repo)}]}' apps.json)
          STATICS=$(jq -c '{include: [.apps[] | select(.type | ascii_downcase | test("static|node")) | . + {repo_url: (.repo_url // .repo)}]}' apps.json)
          DATABASES=$(jq -c '{include: [.apps[] | select(.type | ascii_downcase | test("database")) | . + {repo_url: (.repo_url // .repo)}]}' apps.json)

          COUNT_C=$(echo "$CONTAINERS" | jq '.include | length')
          COUNT_S=$(echo "$STATICS" | jq '.include | length')
          COUNT_D=$(echo "$DATABASES" | jq '.include | length')

          echo "📦 Containers found : $COUNT_C" | tee -a build.log
          echo "⚡ Static Apps found: $COUNT_S" | tee -a build.log
          echo "🗄️ Database Apps found: $COUNT_D" | tee -a build.log

          echo "containers=$CONTAINERS" >> "$GITHUB_OUTPUT"
          echo "statics=$STATICS" >> "$GITHUB_OUTPUT"
          echo "databases=$DATABASES" >> "$GITHUB_OUTPUT"

          [ "$COUNT_C" -gt 0 ] && echo "has_containers=true" >> "$GITHUB_OUTPUT" || echo "has_containers=false" >> "$GITHUB_OUTPUT"
          [ "$COUNT_S" -gt 0 ] && echo "has_statics=true" >> "$GITHUB_OUTPUT" || echo "has_statics=false" >> "$GITHUB_OUTPUT"
          [ "$COUNT_D" -gt 0 ] && echo "has_databases=true" >> "$GITHUB_OUTPUT" || echo "has_databases=false" >> "$GITHUB_OUTPUT"

  # ======================================================
  # 2. BUILD CONTAINERS
  # ======================================================
  build-containers:
    name: 🐳 Build ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    if: ${{ needs.plan.outputs.has_containers == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix_containers) }}
    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v3
        with:
          repository: ${{ matrix.repo_url }}
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GH_PAT }}

      - name: 🏷 Prepare Registry
        id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔨 Build & Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.name }}:latest

      - name: 📝 Log Result
        run: echo "🐳 ${{ matrix.name }} (Container)" | tee -a built_apps.txt

      - uses: actions/upload-artifact@v4
        with:
          name: log-container-${{ matrix.name }}
          path: built_apps.txt

  # ======================================================
  # 3. BUILD STATIC SITES
  # ======================================================
  build-static:
    name: ⚡ Build ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    if: ${{ needs.plan.outputs.has_statics == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix_statics) }}
    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v3
        with:
          repository: ${{ matrix.repo_url }}
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GH_PAT }}
          path: source_code

      - name: 🔨 Build Application
        run: |
          set -e
          echo "==== 🏗️ BUILDING: ${{ matrix.name }} ===="
          
          mkdir -p output
          cd source_code
          
          echo "▶️ Executing: ${{ matrix.build_cmd }}"
          eval "${{ matrix.build_cmd }}"

          if [ ! -d "${{ matrix.output_dir }}" ]; then
            echo "❌ Error: Output directory '${{ matrix.output_dir }}' not found!"
            exit 1
          fi

          # Safe copy using dot syntax
          cp -r "${{ matrix.output_dir }}"/. ../output/
          echo "⚡ ${{ matrix.name }} (Static)" >> ../built_static.txt

      - uses: actions/upload-artifact@v4
        with:
          name: static-site-${{ matrix.name }}
          path: output

      - uses: actions/upload-artifact@v4
        with:
          name: log-static-${{ matrix.name }}
          path: built_static.txt

  # ======================================================
  # 3B. FETCH DATABASE SCHEMA
  # ======================================================
  build-database:
    name: 🗄️ Fetch ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    if: ${{ needs.plan.outputs.has_databases == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix_databases) }}
    steps:
      - name: 📥 Checkout Database Repo
        uses: actions/checkout@v3
        with:
          repository: ${{ matrix.repo_url }}
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GH_PAT }}
          path: db_source

      - name: 📋 Extract Schema & Config
        run: |
          set -e
          echo "==== 📋 PROCESSING: ${{ matrix.name }} ===="
          
          mkdir -p output
          
          # Check if db-config.json exists
          if [ ! -f "db_source/db-config.json" ]; then
            echo "❌ Error: db-config.json not found in repo!"
            exit 1
          fi
          
          # Check if schema directory exists
          if [ ! -d "db_source/schema" ]; then
            echo "❌ Error: schema/ directory not found in repo!"
            exit 1
          fi
          
          # Copy config
          cp "db_source/db-config.json" "output/"
          echo "✅ Config copied: db-config.json"
          
          # Copy all JSON schema files
          cp -r "db_source/schema" "output/"
          SCHEMA_COUNT=$(find "output/schema" -name "*.json" | wc -l)
          echo "✅ Copied $SCHEMA_COUNT schema file(s)"
          
          echo "🗄️ ${{ matrix.name }} (Database)" >> output/status.txt

      - uses: actions/upload-artifact@v4
        with:
          name: db-schema-${{ matrix.name }}
          path: output

      - uses: actions/upload-artifact@v4
        with:
          name: log-database-${{ matrix.name }}
          path: output/status.txt

  # ======================================================
  # 3C. BUILD STATIC SITES (CONTINUED)
  # ======================================================
  deploy:
    name: 🚀 Deploy to VPS
    needs: [plan, build-containers, build-static, build-database]
    runs-on: ubuntu-latest
    if: ${{ always() && !contains(needs.build-containers.result, 'failure') && !contains(needs.build-static.result, 'failure') && !contains(needs.build-database.result, 'failure') }}
    steps:
      - name: 📥 Checkout Infra
        uses: actions/checkout@v3

      - name: 📤 Upload Files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml,apps.json
          target: /opt/ecapps-hosting/

      - name: 🔄 Apply Infrastructure
        uses: appleboy/ssh-action@master
        env:
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_PASS: ${{ secrets.DB_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_USER,GH_TOKEN,DB_PASS
          script: |
            set -e
            echo "==== 🚀 VPS DEPLOYMENT START ====" | tee -a deployment.log

            # 1. Setup Environment
            BASE="/opt/ecapps-hosting"
            mkdir -p "$BASE/data/sites" "$BASE/data/mysql" "$BASE/data/init_sql" "$BASE/data/apache"
            cd "$BASE"

            # 1B. Verify schema directory
            echo "🗄️ Preparing database schema directory..." | tee -a deployment.log
            rm -f "$BASE/data/init_sql"/*  # Clear old schemas
            mkdir -p "$BASE/data/init_sql"

            # 2. Generate Apache VHosts (Using Safe Append Method)
            echo "📝 Generating Dynamic VHosts..." | tee -a deployment.log
            VHOST_FILE="$BASE/data/apache/vhosts.conf"
            echo "# Auto-generated $(date)" > "$VHOST_FILE"

            for row in $(jq -r '.apps[] | select(.type | ascii_downcase | test("static|node")) | @base64' apps.json); do
              _jq() { echo "$row" | base64 --decode | jq -r "$1"; }
              DOMAIN=$(_jq '.domain')
              
              if [ "$DOMAIN" != "null" ] && [ -n "$DOMAIN" ]; then
                echo "   ➕ VHost: $DOMAIN"
                echo "<VirtualHost *:80>" >> "$VHOST_FILE"
                echo "  ServerName ${DOMAIN}" >> "$VHOST_FILE"
                echo "  ServerAlias www.${DOMAIN}" >> "$VHOST_FILE"
                echo "  DocumentRoot /var/www/html/${DOMAIN}" >> "$VHOST_FILE"
                echo "  <Directory /var/www/html/${DOMAIN}>" >> "$VHOST_FILE"
                echo "    Options Indexes FollowSymLinks" >> "$VHOST_FILE"
                echo "    AllowOverride All" >> "$VHOST_FILE"
                echo "    Require all granted" >> "$VHOST_FILE"
                echo "    FallbackResource /index.html" >> "$VHOST_FILE"
                echo "  </Directory>" >> "$VHOST_FILE"
                echo "</VirtualHost>" >> "$VHOST_FILE"
                echo "" >> "$VHOST_FILE"
              fi
            done

            # 3. Generate Docker Compose Overlay
            echo "🐳 Generating docker-compose.prod.yml..." | tee -a deployment.log
            LOWER_USER=$(echo "$GH_USER" | tr '[:upper:]' '[:lower:]')
            echo "$GH_TOKEN" | docker login ghcr.io -u "$LOWER_USER" --password-stdin

            cat > docker-compose.prod.yml <<EOF
            version: "3.8"
            services:
              shared_web:
                image: php:8.1-apache
                container_name: shared_web
                restart: always
                volumes:
                  - "./data/sites:/var/www/html"
                  - "./data/apache/vhosts.conf:/etc/apache2/sites-enabled/000-default.conf"
                networks: [hosting_net]
                command: /bin/sh -c "a2enmod headers rewrite && apache2-foreground"

              db:
                image: mariadb:10.11
                container_name: main_db
                restart: always
                environment:
                  MYSQL_ROOT_PASSWORD: $DB_PASS
                volumes:
                  - "./data/mysql:/var/lib/mysql"
                  - "./data/init_sql:/docker-entrypoint-initdb.d"
                networks: [hosting_net]
            EOF

            # Inject Containers
            for row in $(jq -r '.apps[] | select(.type | ascii_downcase | test("container|backend")) | @base64' apps.json); do
              _jq() { echo "$row" | base64 --decode | jq -r "$1"; }
              NAME=$(_jq '.name')
              echo "   ➕ Container: $NAME"
              
              cat >> docker-compose.prod.yml <<EOF
              $NAME:
                image: ghcr.io/$LOWER_USER/$NAME:latest
                container_name: $NAME
                restart: always
                networks: [hosting_net]
                environment:
            EOF
              echo "$row" | base64 --decode | jq -r '.env | to_entries[] | "      - \(.key)=\(.value)"' \
                | sed "s/DB_ROOT_PASSWORD/$DB_PASS/" >> docker-compose.prod.yml
            done

            # 4. Apply Changes
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

            # 4B. Wait for DB and Apply Schema
            echo "⏳ Waiting for database to be ready..." | tee -a deployment.log
            TIMEOUT=60
            while [ $TIMEOUT -gt 0 ]; do
              if docker exec main_db mysqladmin ping -u root -p$DB_PASS >/dev/null 2>&1; then
                echo "✅ Database is ready!" | tee -a deployment.log
                break
              fi
              echo "⏳ Still waiting... ($TIMEOUT seconds left)"
              sleep 1
              TIMEOUT=$((TIMEOUT - 1))
            done

            if [ $TIMEOUT -le 0 ]; then
              echo "⚠️ Database took too long to start" | tee -a deployment.log
            fi

            # 5. HEALTH CHECK (Critical Safety)
            echo "🩺 Verifying Proxy Health..." | tee -a deployment.log
            sleep 2
            if [ "$(docker inspect -f '{{.State.Running}}' nginx_proxy 2>/dev/null)" != "true" ]; then
                echo "⚠️ Proxy DOWN. Forcing start..."
                docker compose -f docker-compose.yml start nginx_proxy || docker start nginx_proxy || true
                sleep 5
            fi
            
            if [ "$(docker inspect -f '{{.State.Running}}' nginx_proxy 2>/dev/null)" == "true" ]; then
               echo "✅ HEALTHY: nginx_proxy is running."
            else
               echo "❌ CRITICAL: nginx_proxy failed to start."
            fi

      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.has_databases == 'true'
        with:
          pattern: db-schema-*
          path: temp_database
          merge-multiple: false

      - uses: appleboy/scp-action@master
        if: needs.plan.outputs.has_databases == 'true'
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: temp_database/*
          target: /opt/ecapps-hosting/temp_schemas

      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.has_statics == 'true'
        with:
          pattern: static-site-*
          path: temp_static
          merge-multiple: false
      
      - uses: appleboy/scp-action@master
        if: needs.plan.outputs.has_statics == 'true'
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: temp_static/*
          target: /opt/ecapps-hosting/temp_uploads

      - name: 🏁 Finalize & Sync
        if: ${{ always() }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            BASE="/opt/ecapps-hosting"
            
            # Sync Database Schemas
            if [ -d "$BASE/temp_schemas/temp_database" ]; then
                echo "🗄️ Syncing database schemas..."
                for dir in $BASE/temp_schemas/temp_database/*/; do
                   [ -d "$dir" ] || continue
                   SCHEMA_NAME=$(basename "$dir" | sed 's/db-schema-//')
                   CONFIG_FILE="$dir/db-config.json"
                   
                   if [ -f "$CONFIG_FILE" ]; then
                      # Extract config
                      DB_NAME=$(jq -r '.database_name' "$CONFIG_FILE")
                      DB_USER=$(jq -r '.database_user' "$CONFIG_FILE")
                      SECRET_NAME=$(jq -r '.secret_name' "$CONFIG_FILE")
                      
                      echo "   📋 Processing: $SCHEMA_NAME (DB: $DB_NAME)"
                      
                      # Create directory for schema files
                      SCHEMA_DIR="$BASE/data/schemas/$DB_NAME"
                      mkdir -p "$SCHEMA_DIR"
                      
                      # Copy schema files
                      if [ -d "$dir/schema" ]; then
                        cp -r "$dir/schema"/* "$SCHEMA_DIR/" 2>/dev/null || true
                        echo "✅ Schema files copied to $SCHEMA_DIR"
                      else
                        echo "⚠️ No schema directory found in $SCHEMA_NAME"
                      fi
                   else
                      echo "⚠️ No db-config.json found in: $SCHEMA_NAME"
                   fi
                done
                rm -rf $BASE/temp_schemas
            fi
            
            # Sync Static Sites
            if [ -d "$BASE/temp_uploads/temp_static" ]; then
                echo "📦 Syncing static artifacts..."
                for dir in $BASE/temp_uploads/temp_static/*/; do
                   [ -d "$dir" ] || continue
                   SITE_NAME=$(basename "$dir" | sed 's/static-site-//')
                   DOMAIN=$(jq -r ".apps[] | select(.name==\"$SITE_NAME\") | .domain" $BASE/apps.json)
                   
                   if [ "$DOMAIN" != "null" ]; then
                      mkdir -p "$BASE/data/sites/$DOMAIN"
                      rsync -av --delete "$dir" "$BASE/data/sites/$DOMAIN/"
                   fi
                done
                rm -rf $BASE/temp_uploads
                # Reload Web Server
                cd $BASE && docker compose -f docker-compose.yml -f docker-compose.prod.yml restart shared_web
            fi

      - name: 🔄 Apply Schema Migrations
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_PASS,DB_USER,DB_USER_PASS
          script: |
            BASE="/opt/ecapps-hosting"
            DB_HOST="main_db"
            DB_ROOT_USER="root"
            DB_ROOT_PASS="${{ secrets.DB_ROOT_PASSWORD }}"
            
            echo "🔄 Starting schema migrations..."
            
            # Install python MySQL connector if not available
            apt-get update && apt-get install -y python3 python3-pip 2>/dev/null || true
            pip3 install mysql-connector-python 2>/dev/null || true
            
            # Process each database
            if [ -d "$BASE/data/schemas" ]; then
              for db_dir in $BASE/data/schemas/*/; do
                DB_NAME=$(basename "$db_dir")
                SCHEMA_DIR="$db_dir"
                
                echo "   🔧 Migrating database: $DB_NAME"
                
                # Run migration script directly (inline Python)
                python3 << 'PYTHON_SCRIPT'
            import sys
            import json
            import os
            import mysql.connector
            from pathlib import Path
            
            class SchemaMigrator:
                def __init__(self, db_host, db_user, db_pass, db_name):
                    self.host = db_host
                    self.user = db_user
                    self.password = db_pass
                    self.database = db_name
                    self.connection = None
                    self.cursor = None
                
                def connect(self):
                    try:
                        self.connection = mysql.connector.connect(
                            host=self.host,
                            user=self.user,
                            password=self.password,
                            database=self.database
                        )
                        self.cursor = self.connection.cursor()
                        return True
                    except Exception as e:
                        print(f"❌ Connection failed: {e}")
                        return False
                
                def parse_schema_files(self, schema_dir):
                    schemas = {}
                    schema_path = Path(schema_dir)
                    
                    for json_file in schema_path.glob("*.json"):
                        try:
                            with open(json_file, 'r') as f:
                                schema = json.load(f)
                                table_name = schema.get('table_name', json_file.stem)
                                schemas[table_name] = schema
                        except Exception as e:
                            print(f"⚠️ Error reading {json_file}: {e}")
                    
                    return schemas
                
                def create_table_from_json(self, table_name, schema):
                    try:
                        columns = schema.get('columns', {})
                        if not columns:
                            print(f"⚠️ No columns defined for {table_name}")
                            return False
                        
                        # Build CREATE TABLE statement
                        sql_parts = [f"CREATE TABLE IF NOT EXISTS `{table_name}` ("]
                        col_defs = []
                        
                        for col_name, col_def in columns.items():
                            col_sql = f"`{col_name}` {col_def['type']}"
                            
                            if col_def.get('primary_key'):
                                col_sql += " PRIMARY KEY"
                            if col_def.get('auto_increment'):
                                col_sql += " AUTO_INCREMENT"
                            if not col_def.get('nullable', True):
                                col_sql += " NOT NULL"
                            if col_def.get('unique'):
                                col_sql += " UNIQUE"
                            if col_def.get('default'):
                                col_sql += f" DEFAULT {col_def['default']}"
                            
                            col_defs.append(col_sql)
                        
                        sql_parts.append(",\n  ".join(col_defs))
                        
                        # Add indexes
                        indexes = schema.get('indexes', {})
                        for idx_name, idx_def in indexes.items():
                            idx_type = idx_def.get('type', 'KEY')
                            cols = ", ".join([f"`{c}`" for c in idx_def.get('columns', [])])
                            if idx_type.upper() == "UNIQUE":
                                sql_parts.append(f"UNIQUE KEY `{idx_name}` ({cols})")
                            else:
                                sql_parts.append(f"KEY `{idx_name}` ({cols})")
                        
                        # Add foreign keys
                        fk_count = 0
                        for col_name, col_def in columns.items():
                            if col_def.get('foreign_key'):
                                refs = col_def.get('references', {})
                                ref_table = refs.get('table')
                                ref_column = refs.get('column')
                                if ref_table and ref_column:
                                    fk_count += 1
                                    sql_parts.append(f"CONSTRAINT `fk_{table_name}_{col_name}` FOREIGN KEY (`{col_name}`) REFERENCES `{ref_table}` (`{ref_column}`)")
                        
                        sql_parts.append(") ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_general_ci")
                        
                        sql = ",\n  ".join(sql_parts).replace(",\n  UNIQUE KEY", ",\n  UNIQUE KEY").replace(",\n  KEY", ",\n  KEY").replace(",\n  CONSTRAINT", ",\n  CONSTRAINT")
                        
                        self.cursor.execute(sql)
                        self.connection.commit()
                        print(f"   ✅ Table created/verified: {table_name}")
                        return True
                    except Exception as e:
                        print(f"   ❌ Error creating table {table_name}: {e}")
                        return False
                
                def migrate(self, schema_dir):
                    if not self.connect():
                        return False
                    
                    schemas = self.parse_schema_files(schema_dir)
                    if not schemas:
                        print(f"   ⚠️ No schema files found in {schema_dir}")
                        return True
                    
                    success = True
                    for table_name, schema in schemas.items():
                        if not self.create_table_from_json(table_name, schema):
                            success = False
                    
                    if self.cursor:
                        self.cursor.close()
                    if self.connection:
                        self.connection.close()
                    
                    return success
            
            # Main execution
            db_name = os.environ.get('DB_NAME', '')
            schema_dir = os.environ.get('SCHEMA_DIR', '')
            
            migrator = SchemaMigrator(
                db_host='$DB_HOST',
                db_user='$DB_ROOT_USER',
                db_pass='$DB_ROOT_PASS',
                db_name=db_name
            )
            
            success = migrator.migrate(schema_dir)
            sys.exit(0 if success else 1)
            PYTHON_SCRIPT
                
                if [ $? -eq 0 ]; then
                  echo "   ✅ Migration completed for $DB_NAME"
                else
                  echo "   ⚠️ Migration encountered issues for $DB_NAME (check logs)"
                fi
              done
            else
              echo "ℹ️ No schema files found to migrate"
            fi

      - name: 🩺 Verify Database Schema
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_PASS
          script: |
            BASE="/opt/ecapps-hosting"
            DB_PASS="${{ secrets.DB_ROOT_PASSWORD }}"
            
            echo "🗄️ Verifying database schema application..."
            
            # Check if schema files exist in init directory
            SCHEMA_COUNT=$(find $BASE/data/init_sql -name "*.sql" 2>/dev/null | wc -l)
            if [ "$SCHEMA_COUNT" -gt 0 ]; then
              echo "✅ Found $SCHEMA_COUNT schema file(s) in initialization directory"
              ls -lh $BASE/data/init_sql/*.sql
            else
              echo "⚠️ No schema files found (this is OK if database already initialized)"
            fi
            
            # Query database to verify it's running and check tables
            if docker ps | grep -q main_db; then
              TABLES=$(docker exec main_db mysql -u root -p$DB_PASS -e "SHOW TABLES FROM information_schema LIMIT 1" 2>/dev/null | wc -l)
              if [ "$TABLES" -gt 0 ]; then
                echo "✅ Database is operational"
                docker exec main_db mysql -u root -p$DB_PASS -e "SHOW DATABASES;" | head -10
              else
                echo "⚠️ Database query returned no results"
              fi
            else
              echo "⚠️ main_db container is not running"
            fi

  # ======================================================
  # 5. CONFIGURE PROXY
  # ======================================================
  configure-proxy:
    name: 🌐 Configure Nginx Proxy Manager
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ always() && !contains(needs.deploy.result, 'failure') }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.9"
      - run: pip install requests

      # ⚠️ Safety: Normalize types for Python script
      - name: Normalize Apps JSON
        run: |
          jq '.apps |= map(if .type == "node" then .type = "static" else . end)' apps.json > apps_fixed.json && mv apps_fixed.json apps.json

      - env:
          NPM_USER: ${{ secrets.NPM_USER }}
          NPM_PASS: ${{ secrets.NPM_PASS }}
        run: python .github/scripts/configure_npm.py 2>&1 | tee npm_log.txt

      - uses: actions/upload-artifact@v4
        with:
          name: log-npm
          path: npm_log.txt

  # ======================================================
  # 6. NOTIFICATIONS
  # ======================================================
  notify:
    name: 🔔 Notify Summary
    needs: [deploy, configure-proxy]
    if: always()
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
    steps:
      - name: 📥 Download Logs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: log-*
          path: logs
          merge-multiple: true

      - name: 🧠 Build Notification Payload
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PROXY_RESULT: ${{ needs.configure-proxy.result }}
        run: |
          STATUS="failure"
          EMOJI="❌"
          TITLE="Deployment Failed"

          if [ "$DEPLOY_RESULT" = "success" ] && { [ "$PROXY_RESULT" = "success" ] || [ "$PROXY_RESULT" = "skipped" ]; }; then
            STATUS="success"
            EMOJI="✅"
            TITLE="Deployment Successful"
          fi
          
          # Build Message Body
          MESSAGE="<b>Updates:</b>"
          touch apps.txt
          cat logs/log-container-*.txt logs/log-static-*.txt logs/log-database-*.txt >> apps.txt 2>/dev/null || true
          
          if [ -s apps.txt ]; then
             while IFS= read -r line; do MESSAGE+="%0A• $line"; done < apps.txt
          else
             MESSAGE+="%0A• No changes detected."
          fi
          
          if [ -f "logs/npm_log.txt" ]; then
             MESSAGE+="%0A%0A<b>🌐 Proxy:</b>"
             grep -E "❌|⚠️|✅" logs/npm_log.txt | while read -r line; do MESSAGE+="%0A$line"; done || true
          fi

          echo "STATUS=$STATUS" >> "$GITHUB_ENV"
          echo "EMOJI=$EMOJI" >> "$GITHUB_ENV"
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"
          
          echo "TELEGRAM_MSG=$MESSAGE" >> $GITHUB_ENV
          CLEAN_BODY=$(echo "$MESSAGE" | sed 's/%0A/\n/g' | sed 's/<b>//g' | sed 's/<\/b>//g')
          echo "EMAIL_BODY<<EOF" >> $GITHUB_ENV
          echo "$CLEAN_BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 📬 Send Telegram
        if: ${{ env.TELEGRAM_TOKEN != '' }}
        env:
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" -d parse_mode="HTML" -d text="$EMOJI <b>$TITLE</b>%0A%0A$TELEGRAM_MSG"

      - name: 📧 Send Email
        if: ${{ env.EMAIL_USER != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: ${{ env.EMOJI }} ${{ env.TITLE }} - ${{ github.repository }}
          to: ecappmakersonline@gmail.com,raajbala1999@gmail.com
          from: ${{ secrets.EMAIL_USER }}
          body: |
            Build Status: ${{ env.STATUS }}
            ${{ env.EMAIL_BODY }}
            View Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}