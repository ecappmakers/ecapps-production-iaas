name: 🚀 Production Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "production" ]
    paths: [ "apps.json", "docker-compose.yml" ]

permissions:
  contents: read
  packages: write

jobs:
  # ======================================================
  # 1. PLAN (Fail-Safe JSON Generation)
  # ======================================================
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix_containers: ${{ steps.set-matrix.outputs.containers }}
      has_containers: ${{ steps.set-matrix.outputs.has_containers }}
      matrix_statics: ${{ steps.set-matrix.outputs.statics }}
      has_statics: ${{ steps.set-matrix.outputs.has_statics }}
    steps:
      - uses: actions/checkout@v3

      - id: set-matrix
        name: Generate Matrices
        run: |
          # 1. Generate Container Matrix
          CONTAINERS=$(jq -c '{include: [.apps[] | select(.type=="container")]}' apps.json)
          COUNT_C=$(echo "$CONTAINERS" | jq '.include | length')
          
          echo "containers=$CONTAINERS" >> $GITHUB_OUTPUT
          if [ "$COUNT_C" -gt "0" ]; then
            echo "has_containers=true" >> $GITHUB_OUTPUT
            echo "✅ Containers found: $COUNT_C"
          else
            echo "has_containers=false" >> $GITHUB_OUTPUT
            echo "⚠️ No containers found."
          fi

          # 2. Generate Static Matrix
          STATICS=$(jq -c '{include: [.apps[] | select(.type=="static")]}' apps.json)
          COUNT_S=$(echo "$STATICS" | jq '.include | length')

          echo "statics=$STATICS" >> $GITHUB_OUTPUT
          if [ "$COUNT_S" -gt "0" ]; then
            echo "has_statics=true" >> $GITHUB_OUTPUT
            echo "✅ Static sites found: $COUNT_S"
          else
            echo "has_statics=false" >> $GITHUB_OUTPUT
            echo "⚠️ No static sites found."
          fi

  # ======================================================
  # 2. BUILD CONTAINERS
  # ======================================================
  build-containers:
    needs: plan
    runs-on: ubuntu-latest
    if: needs.plan.outputs.has_containers == 'true'
    
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix_containers) }}

    steps:
      - uses: actions/checkout@v3
        with:
          repository: ${{ matrix.repo_url }}
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GH_PAT }}

      - name: Lowercase Repo Owner
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.name }}:latest

      - run: echo "${{ matrix.name }} (Container)" >> built_apps.txt

      - uses: actions/upload-artifact@v4
        with:
          name: log-container-${{ matrix.name }}
          path: built_apps.txt

  # ======================================================
  # 3. BUILD STATIC SITES
  # ======================================================
  build-static:
    needs: plan
    runs-on: ubuntu-latest
    if: needs.plan.outputs.has_statics == 'true'
    
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix_statics) }}

    steps:
      - uses: actions/checkout@v3
        with:
          repository: ${{ matrix.repo_url }}
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GH_PAT }}
          path: source_code

      - name: Build
        run: |
          mkdir -p output
          cd source_code
          ${{ matrix.build_cmd }}
          
          if [ -d "${{ matrix.output_dir }}" ]; then
              cp -r ${{ matrix.output_dir }}/* ../output/
          else
              echo "❌ Output dir ${{ matrix.output_dir }} missing!"
              exit 1
          fi
          echo "${{ matrix.name }} (Static)" >> ../built_static.txt

      - uses: actions/upload-artifact@v4
        with:
          name: static-site-${{ matrix.name }}
          path: output

      - uses: actions/upload-artifact@v4
        with:
          name: log-static-${{ matrix.name }}
          path: built_static.txt

  # ======================================================
  # 4. DEPLOY TO VPS
  # ======================================================
  deploy:
    needs: [plan, build-containers, build-static]
    runs-on: ubuntu-latest
    if: |
      always() && 
      !contains(needs.build-containers.result, 'failure') && 
      !contains(needs.build-static.result, 'failure')

    steps:
      - uses: actions/checkout@v3
      
      - name: Update Base Infra
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/ecapps-hosting/

      - name: Apply Base Infra
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/ecapps-hosting
            docker compose -f docker-compose.yml up -d --remove-orphans

      - name: Update Apps & DB
        uses: appleboy/ssh-action@master
        env:
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_PASS: ${{ secrets.DB_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_USER,GH_TOKEN,DB_PASS
          script: |
            if ! command -v jq &> /dev/null; then
                if [ "$EUID" -ne 0 ]; then
                  echo "⚠️ jq missing and not root - cannot install automatically."
                else
                  export DEBIAN_FRONTEND=noninteractive
                  apt-get update && apt-get install -y jq
                fi
            fi

            BASE="/opt/ecapps-hosting"
            mkdir -p $BASE/data/sites $BASE/data/mysql $BASE/data/init_sql
            cd $BASE
            
            # Lowercase user for docker login
            LOWER_USER=$(echo "$GH_USER" | tr '[:upper:]' '[:lower:]')
            echo $GH_TOKEN | docker login ghcr.io -u $LOWER_USER --password-stdin

            cat > docker-compose.prod.yml <<EOF
            version: '3.8'
            networks: { hosting_net: { external: true } }
            services:
              db:
                image: mariadb:10.11
                container_name: main_db
                restart: always
                environment: { MYSQL_ROOT_PASSWORD: $DB_PASS }
                volumes: [ "./data/mysql:/var/lib/mysql", "./data/init_sql:/docker-entrypoint-initdb.d" ]
                networks: [ hosting_net ]
              shared_web:
                image: php:8.1-apache
                container_name: shared_web
                restart: always
                volumes: [ "./data/sites:/var/www/html" ]
                networks: [ hosting_net ]
            EOF

            CONTAINER_COUNT=$(jq '[.apps[] | select(.type=="container")] | length' apps.json)

            if [ "$CONTAINER_COUNT" -gt "0" ]; then
                for row in $(jq -r '.apps[] | select(.type=="container") | @base64' apps.json); do
                  _jq() { echo $row | base64 --decode | jq -r "$1"; }
                  NAME=$(_jq '.name')
                  # Lowercase user in image path
                  IMAGE="ghcr.io/$LOWER_USER/$NAME:latest"

                  echo "  $NAME:" >> docker-compose.prod.yml
                  echo "    image: $IMAGE" >> docker-compose.prod.yml
                  echo "    container_name: $NAME" >> docker-compose.prod.yml
                  echo "    restart: always" >> docker-compose.prod.yml
                  echo "    networks: [hosting_net]" >> docker-compose.prod.yml
                  echo "    environment:" >> docker-compose.prod.yml
                  
                  echo $row | base64 --decode | jq -r '.env | to_entries | .[] | .key + "=" + .value' | while read line; do
                    KEY=$(echo $line | cut -d= -f1)
                    VAL=$(echo $line | cut -d= -f2)
                    [ "$VAL" = "DB_ROOT_PASSWORD" ] && VAL="$DB_PASS"
                    echo "      - $KEY=$VAL" >> docker-compose.prod.yml
                  done
                done
            fi

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.has_statics == 'true'
        with: { pattern: static-site-*, path: temp_static, merge-multiple: false }

      - uses: appleboy/scp-action@master
        if: needs.plan.outputs.has_statics == 'true'
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: temp_static/*
          target: /opt/ecapps-hosting/temp_uploads

      - name: Finalize Static
        if: needs.plan.outputs.has_statics == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            BASE="/opt/ecapps-hosting"
            mkdir -p $BASE/temp_uploads
            
            if [ -d "$BASE/temp_uploads/temp_static" ]; then
                for dir in $BASE/temp_uploads/temp_static/*/; do
                   [ -d "$dir" ] || continue
                   SITE_NAME=$(basename "$dir" | sed 's/static-site-//')
                   DOMAIN=$(jq -r ".apps[] | select(.name==\"$SITE_NAME\") | .domain" $BASE/apps.json)
                   
                   if [ "$DOMAIN" != "null" ] && [ ! -z "$DOMAIN" ]; then
                      mkdir -p "$BASE/data/sites/$DOMAIN"
                      rsync -av --delete "$dir" "$BASE/data/sites/$DOMAIN/"
                   fi
                done
                rm -rf $BASE/temp_uploads
            fi

  # ======================================================
  # 5. CONFIGURE PROXY
  # ======================================================
  configure-proxy:
    needs: deploy
    runs-on: ubuntu-latest
    if: needs.deploy.result == 'success'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: { python-version: '3.9' }
      - run: pip install requests
      - env:
          NPM_USER: ${{ secrets.NPM_USER }}
          NPM_PASS: ${{ secrets.NPM_PASS }}
        run: python .github/scripts/configure_npm.py 2>&1 | tee npm_log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: log-npm, path: npm_log.txt }

  # ======================================================
  # 6. NOTIFICATIONS
  # ======================================================
  notify:
    needs: [deploy, configure-proxy]
    if: always()
    runs-on: ubuntu-latest
    
    # ✅ FIX: Map secrets to env vars at the JOB level.
    # This bypasses the parser error because 'env' context is always allowed in 'if'.
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}

    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: log-*, path: logs, merge-multiple: true }
      
      - name: Prepare Message
        id: msg
        env:
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          PROXY_STATUS: ${{ needs.configure-proxy.result }}
        run: |
          if [ "$DEPLOY_STATUS" == "success" ] && ( [ "$PROXY_STATUS" == "success" ] || [ "$PROXY_STATUS" == "skipped" ] ); then
             echo "EMOJI=✅" >> $GITHUB_ENV
             echo "TITLE=Pipeline Success" >> $GITHUB_ENV
             echo "STATUS=success" >> $GITHUB_ENV
          else
             echo "EMOJI=❌" >> $GITHUB_ENV
             echo "TITLE=Pipeline Failed" >> $GITHUB_ENV
             echo "STATUS=failure" >> $GITHUB_ENV
          fi
          
          MESSAGE="<b>Updates:</b>"
          touch apps.txt
          cat logs/log-container-*.txt logs/log-static-*.txt >> apps.txt 2>/dev/null || true
          
          if [ ! -s apps.txt ]; then
             MESSAGE+="%0A• No changes detected or all builds skipped."
          else
             while IFS= read -r line; do MESSAGE+="%0A• $line"; done < apps.txt
          fi
          
          if [ -f "logs/npm_log.txt" ]; then
             MESSAGE+="%0A%0A<b>🌐 Proxy:</b>"
             grep -E "❌|⚠️|✅" logs/npm_log.txt | while read -r line; do MESSAGE+="%0A$line"; done || true
          fi
          
          echo "TELEGRAM_MSG=$MESSAGE" >> $GITHUB_ENV
          CLEAN_BODY=$(echo "$MESSAGE" | sed 's/%0A/\n/g' | sed 's/<b>//g' | sed 's/<\/b>//g')
          
          echo "EMAIL_BODY<<EOF" >> $GITHUB_ENV
          echo "$CLEAN_BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Telegram
        # ✅ FIX: Check the 'env' context, which is syntax-safe
        if: ${{ env.TELEGRAM_TOKEN != '' }}
        env:
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Token is already in job env, but we can access it here
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" -d parse_mode="HTML" -d text="$EMOJI <b>$TITLE</b>%0A%0A$TELEGRAM_MSG"

      - name: Send Email
        # ✅ FIX: Check the 'env' context, which is syntax-safe
        if: ${{ env.EMAIL_USER != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: ${{ env.EMOJI }} ${{ env.TITLE }} - ${{ github.repository }}
          to: ecappmakersonline@gmail.com,raajbala1999@gmail.com
          from: ${{ secrets.EMAIL_USER }}
          body: |
            Build Status: ${{ env.STATUS }}
            
            ${{ env.EMAIL_BODY }}
            
            View Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}