name: 🚀 Production Deployment Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - production
    paths:
      - apps.json
      - docker-compose.yml
      - .github/workflows/production_pipeline.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:

  # ======================================================
  # 1. PLAN & DETECT
  # ======================================================
  plan:
    name: 🧭 Plan & Detect Applications
    runs-on: ubuntu-latest
    outputs:
      matrix_containers: ${{ steps.set-matrix.outputs.containers }}
      has_containers: ${{ steps.set-matrix.outputs.has_containers }}
      matrix_statics: ${{ steps.set-matrix.outputs.statics }}
      has_statics: ${{ steps.set-matrix.outputs.has_statics }}
      matrix_springs: ${{ steps.set-matrix.outputs.springs }}
      has_spring: ${{ steps.set-matrix.outputs.has_spring }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧮 Analyze apps.json
        id: set-matrix
        run: |
          set -e
          echo "==== 🎯 APPLICATION DISCOVERY ====" | tee -a build.log

          if [ ! -f apps.json ]; then
            echo "❌ CRITICAL: apps.json missing" | tee -a build.log
            exit 1
          fi

          # Validate apps.json schema — every entry must have name, type, and repo/repo_url
          echo "🔍 Validating apps.json schema..." | tee -a build.log
          INVALID=$(jq -r '[.apps[] | select(.name == null or .name == "" or .type == null or .type == "" or ((.repo_url == null or .repo_url == "") and (.repo == null or .repo == "")))] | length' apps.json)
          if [ "$INVALID" -gt 0 ]; then
            echo "❌ CRITICAL: $INVALID app(s) missing required fields (name, type, repo_url/repo)" | tee -a build.log
            jq '.apps[] | select(.name == null or .name == "" or .type == null or .type == "" or ((.repo_url == null or .repo_url == "") and (.repo == null or .repo == "")))' apps.json | tee -a build.log
            exit 1
          fi
          echo "✅ All apps have required fields" | tee -a build.log

          # Logic: Maps 'repo' -> 'repo_url' and handles types case-insensitively
          CONTAINERS=$(jq -c '{include: [.apps[] | select(.type | ascii_downcase | test("container|backend")) | . + {repo_url: (.repo_url // .repo)}]}' apps.json)
          STATICS=$(jq -c '{include: [.apps[] | select(.type | ascii_downcase | test("static|node")) | . + {repo_url: (.repo_url // .repo)}]}' apps.json)
          SPRINGS=$(jq -c '{include: [.apps[] | select(.type | ascii_downcase | test("spring")) | . + {repo_url: (.repo_url // .repo)}]}' apps.json)

          COUNT_C=$(echo "$CONTAINERS" | jq '.include | length')
          COUNT_S=$(echo "$STATICS" | jq '.include | length')
          COUNT_SP=$(echo "$SPRINGS" | jq '.include | length')

          echo "📦 Containers found : $COUNT_C" | tee -a build.log
          echo "⚡ Static Apps found: $COUNT_S" | tee -a build.log
          echo "🍃 Spring Apps found : $COUNT_SP" | tee -a build.log

          echo "containers=$CONTAINERS" >> "$GITHUB_OUTPUT"
          echo "statics=$STATICS" >> "$GITHUB_OUTPUT"
          echo "springs=$SPRINGS" >> "$GITHUB_OUTPUT"

          [ "$COUNT_C" -gt 0 ] && echo "has_containers=true" >> "$GITHUB_OUTPUT" || echo "has_containers=false" >> "$GITHUB_OUTPUT"
          [ "$COUNT_S" -gt 0 ] && echo "has_statics=true" >> "$GITHUB_OUTPUT" || echo "has_statics=false" >> "$GITHUB_OUTPUT"
          [ "$COUNT_SP" -gt 0 ] && echo "has_spring=true" >> "$GITHUB_OUTPUT" || echo "has_spring=false" >> "$GITHUB_OUTPUT"

  # ======================================================
  # 2. BUILD CONTAINERS
  # ======================================================
  build-containers:
    name: 🐳 Build ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    if: ${{ needs.plan.outputs.has_containers == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix_containers) }}
    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo_url }}
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GH_PAT }}

      - name: 🔑 Prepare Registry
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 🔒 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔨 Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.name }}:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📝 Log Result
        run: echo "🐳 ${{ matrix.name }} (Container)" | tee -a built_apps.txt

      - uses: actions/upload-artifact@v4
        with:
          name: log-container-${{ matrix.name }}
          path: built_apps.txt
          retention-days: 7

  # ======================================================
  # 3. BUILD STATIC SITES
  # ======================================================
  build-static:
    name: ⚡ Build ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    if: ${{ needs.plan.outputs.has_statics == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix_statics) }}
    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo_url }}
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GH_PAT }}
          path: source_code

      - name: 🔨 Build Application
        run: |
          set -e
          echo "==== 🛠️ BUILDING: ${{ matrix.name }} ======"
          
          mkdir -p output
          cd source_code
          
          echo "▶️ Executing: ${{ matrix.build_cmd }}"
          eval "${{ matrix.build_cmd }}"

          if [ ! -d "${{ matrix.output_dir }}" ]; then
            echo "❌ Error: Output directory '${{ matrix.output_dir }}' not found!"
            exit 1
          fi

          # Safe copy using dot syntax
          cp -r "${{ matrix.output_dir }}"/. ../output/
          
          # Check current directory and list repo root files
          echo ""
          echo "[DEBUG] Current working directory: $(pwd)"
          echo "[DEBUG] Files in current directory:"
          ls -lah | head -20
          echo ""
          
          # Include .htaccess and .htpasswd from repo root if they exist
          echo "[COPYING SPECIAL FILES]"
          if [ -f ".htaccess" ]; then
            echo "  ✅ Found .htaccess in repo root"
            echo "     Location: $(pwd)/.htaccess"
            echo "     Size: $(stat -c%s .htaccess)"
            echo "     Copying to ../output/.htaccess..."
            cp -v ".htaccess" "../output/.htaccess"
            HTACCESS_COPY=$?
            if [ $HTACCESS_COPY -eq 0 ]; then
              echo "     ✅ Copy successful"
            else
              echo "     ❌ Copy failed with exit code: $HTACCESS_COPY"
            fi
          else
            echo "  ❌ .htaccess NOT found in repo root"
            echo "     Expected at: $(pwd)/.htaccess"
          fi
          
          echo ""
          
          if [ -f ".htpasswd" ]; then
            echo "  ✅ Found .htpasswd in repo root"
            echo "     Location: $(pwd)/.htpasswd"
            echo "     Size: $(stat -c%s .htpasswd)"
            echo "     Copying to ../output/.htpasswd..."
            cp -v ".htpasswd" "../output/.htpasswd"
            HTPASSWD_COPY=$?
            if [ $HTPASSWD_COPY -eq 0 ]; then
              echo "     ✅ Copy successful"
            else
              echo "     ❌ Copy failed with exit code: $HTPASSWD_COPY"
            fi
          else
            echo "  ❌ .htpasswd NOT found in repo root"
            echo "     Expected at: $(pwd)/.htpasswd"
          fi
          
          echo ""
          echo "⚡ ${{ matrix.name }} (Static)" >> ../built_static.txt

      - name: 📋 Verify Artifact Contents
        run: |
          echo "==== 📋 ARTIFACT CONTENTS FOR: ${{ matrix.name }} ===="
          echo ""
          echo "Output directory structure (full listing):"
          ls -lah output/ || echo "Directory doesn't exist!"
          echo ""
          echo "Total files in output directory:"
          find output -type f -exec ls -lh {} \; | wc -l
          echo ""
          
          echo "Checking for .htaccess:"
          if [ -f "output/.htaccess" ]; then
            echo "  ✅ Found output/.htaccess"
            echo "     Size: $(stat -c%s output/.htaccess) bytes"
            echo "     Permissions: $(stat -c%A output/.htaccess)"
            echo "     Content preview:"
            head -5 output/.htaccess | sed 's/^/       /'
          else
            echo "  ❌ output/.htaccess NOT found"
            echo "     Searched: $(pwd)/output/.htaccess"
          fi
          echo ""
          
          echo "Checking for .htpasswd:"
          if [ -f "output/.htpasswd" ]; then
            echo "  ✅ Found output/.htpasswd"
            echo "     Size: $(stat -c%s output/.htpasswd) bytes"
            echo "     Permissions: $(stat -c%A output/.htpasswd)"
          else
            echo "  ❌ output/.htpasswd NOT found"
            echo "     Searched: $(pwd)/output/.htpasswd"
          fi
          echo ""
          
          echo "Total files in output:"
          find output -type f | wc -l
          echo ""
          echo "All files in output (recursive):"
          find output -type f -printf '%p (%s bytes)\n' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: static-site-${{ matrix.name }}
          path: output
          include-hidden-files: true
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: log-static-${{ matrix.name }}
          path: built_static.txt
          retention-days: 7

  # ======================================================
  # 3D. BUILD SPRING BOOT (SPLIT FRONTEND)
  # ======================================================
  build-spring:
    name: 🍃 Build ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    if: ${{ needs.plan.outputs.has_spring == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix_springs) }}
    steps:
      - name: 📥 Checkout Backend (Main Repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo_url }}
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GH_PAT }}
          path: backend

      - name: 📥 Checkout Frontend Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.frontend.repo }}
          ref: ${{ matrix.frontend.branch || 'main' }}
          token: ${{ secrets.GH_PAT }}
          path: frontend

      - name: 🔧 Setup Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 🔨 Build Frontend
        run: |
          set -e
          echo "==== 🎨 BUILDING FRONTEND for ${{ matrix.name }} ======"
          cd frontend

          # Use custom build command if provided, otherwise default
          BUILD_CMD="${{ matrix.frontend.build_cmd }}"
          if [ -z "$BUILD_CMD" ] || [ "$BUILD_CMD" == "null" ]; then
            BUILD_CMD="npm install && npm run build"
          fi

          echo "▶️ Executing: $BUILD_CMD"
          eval "$BUILD_CMD"

          # Determine output directory
          OUTPUT_DIR="${{ matrix.frontend.output_dir }}"
          if [ -z "$OUTPUT_DIR" ] || [ "$OUTPUT_DIR" == "null" ]; then
            OUTPUT_DIR="dist"
          fi

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "❌ Error: Frontend output directory '$OUTPUT_DIR' not found!"
            ls -la
            exit 1
          fi

          echo "✅ Frontend build complete. Output in: $OUTPUT_DIR"

      - name: 📦 Merge Frontend Assets into Backend
        run: |
          set -e
          echo "==== 📦 MERGING FRONTEND INTO BACKEND ======"

          # Determine frontend output directory
          OUTPUT_DIR="${{ matrix.frontend.output_dir }}"
          if [ -z "$OUTPUT_DIR" ] || [ "$OUTPUT_DIR" == "null" ]; then
            OUTPUT_DIR="dist"
          fi

          STATIC_DIR="backend/src/main/resources/static"
          mkdir -p "$STATIC_DIR"

          echo "▶️ Copying frontend/$OUTPUT_DIR/* → $STATIC_DIR/"
          cp -r "frontend/$OUTPUT_DIR"/. "$STATIC_DIR/"

          echo "✅ Merged $(find "$STATIC_DIR" -type f | wc -l) files into static resources"
          ls -lah "$STATIC_DIR" | head -20

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'

      - name: 🧪 Run JUnit Tests
        run: |
          set -e
          echo "==== 🧪 RUNNING TESTS: ${{ matrix.name }} ======"
          cd backend

          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            echo "▶️ Running Maven tests..."
            ./mvnw test
          elif [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "▶️ Running Gradle tests..."
            ./gradlew test
          else
            echo "❌ Error: No mvnw or gradlew found!"
            exit 1
          fi

          echo "✅ All tests passed"

      - name: 📊 Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.name }}
          path: |
            backend/target/surefire-reports/
            backend/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: 🔨 Build Spring Boot Backend
        run: |
          set -e
          echo "==== ☕ BUILDING SPRING BOOT: ${{ matrix.name }} ======"
          cd backend

          # Tests already passed — build and package (skip re-running tests)
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            echo "▶️ Packaging with Maven Wrapper..."
            ./mvnw package -DskipTests
          elif [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "▶️ Packaging with Gradle Wrapper..."
            ./gradlew build -x test
          else
            echo "❌ Error: No mvnw or gradlew found!"
            exit 1
          fi

          echo "✅ Backend build complete"

          # Find the output JAR
          JAR_FILE=$(find target -name "*.jar" -not -name "*-sources.jar" -not -name "*-javadoc.jar" 2>/dev/null | head -1)
          if [ -z "$JAR_FILE" ]; then
            JAR_FILE=$(find build/libs -name "*.jar" -not -name "*-plain.jar" 2>/dev/null | head -1)
          fi

          if [ -z "$JAR_FILE" ]; then
            echo "❌ Error: No JAR file found after build!"
            exit 1
          fi

          echo "📦 JAR found: $JAR_FILE"
          echo "JAR_FILE=$JAR_FILE" >> "$GITHUB_ENV"

      - name: 🔑 Prepare Registry
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 🔒 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Containerize Spring Boot App
        run: |
          set -e
          echo "==== 🐳 CONTAINERIZING: ${{ matrix.name }} ======"
          cd backend

          # Check if a Dockerfile exists in the backend
          if [ ! -f "Dockerfile" ]; then
            echo "⚠️ No Dockerfile found. Generating temporary Dockerfile..."

            # Find the JAR file relative to backend directory
            JAR_FILE=$(find target -name "*.jar" -not -name "*-sources.jar" -not -name "*-javadoc.jar" 2>/dev/null | head -1)
            if [ -z "$JAR_FILE" ]; then
              JAR_FILE=$(find build/libs -name "*.jar" -not -name "*-plain.jar" 2>/dev/null | head -1)
            fi

            cat > Dockerfile <<DOCKERFILE
          FROM eclipse-temurin:21-jre-alpine
          WORKDIR /app
          COPY ${JAR_FILE} app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "app.jar"]
          DOCKERFILE

            echo "✅ Generated Dockerfile:"
            cat Dockerfile
          else
            echo "✅ Using existing Dockerfile from repository"
          fi

      - name: 🔨 Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.name }}:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📝 Log Result
        run: echo "🍃 ${{ matrix.name }} (Spring)" | tee -a built_apps.txt

      - uses: actions/upload-artifact@v4
        with:
          name: log-spring-${{ matrix.name }}
          path: built_apps.txt
          retention-days: 7

  # ======================================================
  # 4. DEPLOY TO VPS
  # ======================================================
  deploy:
    name: 🚀 Deploy to VPS
    needs: [plan, build-containers, build-static, build-spring]
    runs-on: ubuntu-latest
    if: ${{ always() && !contains(needs.build-containers.result, 'failure') && !contains(needs.build-static.result, 'failure') && !contains(needs.build-spring.result, 'failure') }}
    steps:
      - name: 📥 Checkout Infra
        uses: actions/checkout@v4

      - name: 📤 Upload Files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml,Dockerfile.php,apps.json,.github/scripts/
          target: /opt/ecapps-hosting/

      - name: 🐍 Install Python & Dependencies
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo "🐍 Installing Python and dependencies..."
            apt-get update -qq
            apt-get install -y python3 python3-pip 2>/dev/null
            pip3 install --quiet mysql-connector-python requests urllib3 2>/dev/null
            echo "✅ Python environment ready"

      - name: 🏗️ Apply Infrastructure
        uses: appleboy/ssh-action@master
        env:
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_PASS: ${{ secrets.DB_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_USER,GH_TOKEN,DB_PASS
          command_timeout: 10m
          script: |
            set -e
            echo "==== 🚀 VPS DEPLOYMENT START ====" | tee -a deployment.log

            # 1. Setup Environment
            BASE="/opt/ecapps-hosting"
            mkdir -p "$BASE/data/sites" "$BASE/data/mysql" "$BASE/data/apache"
            cd "$BASE"

            # 2. Generate Apache VHosts (Using Safe Append Method)
            echo "🌐 Generating Dynamic VHosts..." | tee -a deployment.log
            VHOST_FILE="$BASE/data/apache/vhosts.conf"
            echo "# Auto-generated $(date)" > "$VHOST_FILE"

            for row in $(jq -r '.apps[] | select(.type | ascii_downcase | test("static|node")) | @base64' apps.json); do
              _jq() { echo "$row" | base64 --decode | jq -r "$1"; }
              DOMAIN=$(_jq '.domain')
              
              if [ "$DOMAIN" != "null" ] && [ -n "$DOMAIN" ]; then
                echo "   ➕ VHost: $DOMAIN"
                echo "<VirtualHost *:80>" >> "$VHOST_FILE"
                echo "  ServerName ${DOMAIN}" >> "$VHOST_FILE"
                echo "  ServerAlias www.${DOMAIN}" >> "$VHOST_FILE"
                echo "  DocumentRoot /var/www/html/${DOMAIN}" >> "$VHOST_FILE"
                echo "  <Directory /var/www/html/${DOMAIN}>" >> "$VHOST_FILE"
                echo "    Options Indexes FollowSymLinks" >> "$VHOST_FILE"
                echo "    AllowOverride All" >> "$VHOST_FILE"
                echo "    Require all granted" >> "$VHOST_FILE"
                echo "    FallbackResource /index.html" >> "$VHOST_FILE"
                echo "  </Directory>" >> "$VHOST_FILE"
                echo "</VirtualHost>" >> "$VHOST_FILE"
                echo "" >> "$VHOST_FILE"
              fi
            done

            # 3. Generate Docker Compose Overlay
            echo "🐳 Generating docker-compose.prod.yml..." | tee -a deployment.log
            LOWER_USER=$(echo "$GH_USER" | tr '[:upper:]' '[:lower:]')
            echo "$GH_TOKEN" | docker login ghcr.io -u "$LOWER_USER" --password-stdin

            cat > docker-compose.prod.yml <<EOF
            services:
              shared_web:
                build:
                  context: .
                  dockerfile: Dockerfile.php
                image: shared_web:latest
                container_name: shared_web
                restart: always
                volumes:
                  - "./data/sites:/var/www/html"
                  - "./data/apache/vhosts.conf:/etc/apache2/sites-enabled/000-default.conf"
                networks: [hosting_net]


              db:
                image: mariadb:10.11
                container_name: main_db
                restart: always
                ports:
                  - '3306:3306'
                environment:
                  MYSQL_ROOT_PASSWORD: $DB_PASS
                volumes:
                  - "./data/mysql:/var/lib/mysql"
                networks: [hosting_net]

              redis:
                image: redis:7-alpine
                container_name: main_redis
                restart: always
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 5s
                  timeout: 3s
                  retries: 5
                networks: [hosting_net]
            EOF

            # Inject Containers
            for row in $(jq -r '.apps[] | select(.type | ascii_downcase | test("container|backend")) | @base64' apps.json); do
              _jq() { echo "$row" | base64 --decode | jq -r "$1"; }
              NAME=$(_jq '.name')
              echo "   ➕ Container: $NAME"
              
              cat >> docker-compose.prod.yml <<EOF
              $NAME:
                image: ghcr.io/$LOWER_USER/$NAME:latest
                container_name: $NAME
                restart: always
                networks: [hosting_net]
                environment:
            EOF
              echo "$row" | base64 --decode | jq -r '.env | to_entries[] | "      - \(.key)=\(.value)"' \
                | sed "s/DB_ROOT_PASSWORD/$DB_PASS/" >> docker-compose.prod.yml
            done

            # Inject Spring Containers
            for row in $(jq -r '.apps[] | select(.type | ascii_downcase | test("spring")) | @base64' apps.json); do
              _jq() { echo "$row" | base64 --decode | jq -r "$1"; }
              NAME=$(_jq '.name')
              echo "   ➕ Spring Container: $NAME"
              
              cat >> docker-compose.prod.yml <<EOF
              $NAME:
                image: ghcr.io/$LOWER_USER/$NAME:latest
                container_name: $NAME
                restart: always
                networks: [hosting_net]
                depends_on:
                  - db
                  - redis
                environment:
                  - SPRING_DATA_REDIS_HOST=main_redis
                  - SPRING_DATASOURCE_URL=jdbc:mariadb://main_db:3306/$NAME
                  - SPRING_DATASOURCE_USERNAME=root
                  - SPRING_DATASOURCE_PASSWORD=$DB_PASS
            EOF
              # Append any additional env vars from apps.json
              echo "$row" | base64 --decode | jq -r 'if .env then .env | to_entries[] | "      - \(.key)=\(.value)" else empty end' \
                | sed "s/DB_ROOT_PASSWORD/$DB_PASS/" >> docker-compose.prod.yml
            done

            # Append top-level networks definition
            cat >> docker-compose.prod.yml <<EOF

            networks:
              hosting_net:
                external: true
            EOF

            # 4. Build local images and pull remote images
            echo "🔨 Building shared_web from Dockerfile..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build shared_web
            
            echo "📥 Pulling remote images..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull --ignore-buildable
            
            echo "🚀 Starting services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

            # 4B. Wait for DB and Apply Schema
            echo "⏳ Waiting for database to be ready..." | tee -a deployment.log
            TIMEOUT=60
            while [ $TIMEOUT -gt 0 ]; do
              if docker exec main_db mysqladmin ping -u root -p$DB_PASS >/dev/null 2>&1; then
                echo "✅ Database is ready!" | tee -a deployment.log
                break
              fi
              echo "⏳ Still waiting... ($TIMEOUT seconds left)"
              sleep 1
              TIMEOUT=$((TIMEOUT - 1))
            done

            if [ $TIMEOUT -le 0 ]; then
              echo "⚠️ Database took too long to start" | tee -a deployment.log
            fi

            # 5. HEALTH CHECK (Critical Safety)
            echo "💪 Verifying Proxy Health..." | tee -a deployment.log
            sleep 2
            if [ "$(docker inspect -f '{{.State.Running}}' nginx_proxy 2>/dev/null)" != "true" ]; then
                echo "⚠️ Proxy DOWN. Forcing start..."
                docker compose -f docker-compose.yml start nginx_proxy || docker start nginx_proxy || true
                sleep 10
            fi
            
            if [ "$(docker inspect -f '{{.State.Running}}' nginx_proxy 2>/dev/null)" == "true" ]; then
               echo "✅ HEALTHY: nginx_proxy is running."
            else
               echo "❌ CRITICAL: nginx_proxy failed to start."
            fi

            # 6. Spring Boot Health Checks
            for row in $(jq -r '.apps[] | select(.type | ascii_downcase | test("spring")) | @base64' apps.json); do
              _jq() { echo "$row" | base64 --decode | jq -r "$1"; }
              NAME=$(_jq '.name')
              PORT=$(_jq '.port // 8080')
              echo "🍃 Checking health of Spring app: $NAME"
              HEALTH_TIMEOUT=60
              while [ $HEALTH_TIMEOUT -gt 0 ]; do
                HEALTH=$(docker exec "$NAME" wget -qO- "http://localhost:$PORT/actuator/health" 2>/dev/null || true)
                if echo "$HEALTH" | grep -q '"UP"'; then
                  echo "✅ $NAME is healthy!"
                  break
                fi
                echo "⏳ Waiting for $NAME... ($HEALTH_TIMEOUT s left)"
                sleep 2
                HEALTH_TIMEOUT=$((HEALTH_TIMEOUT - 2))
              done
              if [ $HEALTH_TIMEOUT -le 0 ]; then
                echo "⚠️ $NAME did not become healthy within timeout"
                echo "   Last 20 log lines:"
                docker logs --tail 20 "$NAME" 2>&1 | sed 's/^/   /'
              fi
            done

      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.has_statics == 'true'
        with:
          pattern: static-site-*
          path: temp_static
          merge-multiple: false
      
      - uses: appleboy/scp-action@master
        if: needs.plan.outputs.has_statics == 'true'
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: temp_static/*
          target: /opt/ecapps-hosting/temp_uploads

      - name: 🔄 Finalize & Sync
        if: ${{ always() }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            BASE="/opt/ecapps-hosting"
            
            echo "==================== 📦 STARTING SYNC OPERATIONS ===================="
            echo ""
            
            # Sync Static Sites
            if [ -d "$BASE/temp_uploads/temp_static" ]; then
                echo ""
                echo "[ARTIFACT CONTENTS CHECK]"
                echo "Found temp_static directory structure:"
                find "$BASE/temp_uploads/temp_static" -type f -printf '%p (%s bytes)\n' | head -30
                echo ""
                echo "Looking for .htaccess and .htpasswd in artifacts:"
                find "$BASE/temp_uploads/temp_static" -name ".htaccess" -o -name ".htpasswd" | while read file; do
                  echo "  ✅ Found: $file ($(stat -c%s "$file") bytes)"
                done
                HTFILE_COUNT=$(find "$BASE/temp_uploads/temp_static" -name ".htaccess" -o -name ".htpasswd" | wc -l)
                if [ $HTFILE_COUNT -eq 0 ]; then
                  echo "  ❌ No .htaccess or .htpasswd files found in artifacts"
                fi
                echo ""
                
                echo "📦 Syncing static artifacts..."
                echo ""
                
                for dir in $BASE/temp_uploads/temp_static/*/; do
                   [ -d "$dir" ] || continue
                   SITE_NAME=$(basename "$dir" | sed 's/static-site-//')
                   DOMAIN=$(jq -r ".apps[] | select(.name==\"$SITE_NAME\") | .domain" $BASE/apps.json)
                   
                   if [ "$DOMAIN" != "null" ]; then
                      SITE_DIR="$BASE/data/sites/$DOMAIN"
                      mkdir -p "$SITE_DIR"
                      
                      echo "════════════════════════════════════════════════════════════════"
                      echo "🌐 Processing: $SITE_NAME ($DOMAIN)"
                      echo "════════════════════════════════════════════════════════════════"
                      echo ""
                      echo "📍 Source directory: $dir"
                      echo "📍 Target directory: $SITE_DIR"
                      echo ""
                      
                      # Pre-sync check
                      echo "[PRE-SYNC CHECK]"
                      echo "📋 Files in source artifact:"
                      ls -lah "$dir" | head -20
                      echo ""
                      
                      echo "📋 Checking for special files in source:"
                      if [ -f "$dir/.htaccess" ]; then
                        echo "  ✅ .htaccess found in source"
                        echo "     Size: $(stat -f%z "$dir/.htaccess" 2>/dev/null || stat -c%s "$dir/.htaccess")"
                        echo "     Content preview:"
                        head -3 "$dir/.htaccess" | sed 's/^/       /'
                      else
                        echo "  ❌ .htaccess NOT in source"
                      fi
                      
                      if [ -f "$dir/.htpasswd" ]; then
                        echo "  ✅ .htpasswd found in source"
                        echo "     Size: $(stat -f%z "$dir/.htpasswd" 2>/dev/null || stat -c%s "$dir/.htpasswd")"
                      else
                        echo "  ❌ .htpasswd NOT in source"
                      fi
                      echo ""
                      
                      # Backup existing .htaccess and .htpasswd if present
                      if [ -f "$SITE_DIR/.htaccess" ]; then
                        cp "$SITE_DIR/.htaccess" "$SITE_DIR/.htaccess.backup"
                        echo "  📋 Backed up existing .htaccess"
                      fi
                      if [ -f "$SITE_DIR/.htpasswd" ]; then
                        cp "$SITE_DIR/.htpasswd" "$SITE_DIR/.htpasswd.backup"
                        echo "  📋 Backed up existing .htpasswd"
                      fi
                      echo ""
                      
                      # Sync all files except .htaccess and .htpasswd
                      echo "[SYNCING FILES]"
                      echo "Running rsync with --delete..."
                      rsync -av --delete --exclude='.htaccess' --exclude='.htpasswd' "$dir" "$SITE_DIR/"
                      RSYNC_EXIT=$?
                      echo "Rsync exit code: $RSYNC_EXIT"
                      echo ""
                      
                      # Handle .htaccess: copy from source if exists, otherwise restore backup
                      echo "[HANDLING .htaccess]"
                      if [ -f "$dir/.htaccess" ]; then
                        cp "$dir/.htaccess" "$SITE_DIR/.htaccess"
                        echo "  ✅ Copied new .htaccess from source"
                      elif [ -f "$SITE_DIR/.htaccess.backup" ]; then
                        mv "$SITE_DIR/.htaccess.backup" "$SITE_DIR/.htaccess"
                        echo "  ↩️ Restored existing .htaccess from backup"
                      else
                        echo "  ⚠️ No .htaccess found (source or backup)"
                      fi
                      echo ""
                      
                      # Handle .htpasswd: copy from source if exists, otherwise restore backup
                      echo "[HANDLING .htpasswd]"
                      if [ -f "$dir/.htpasswd" ]; then
                        cp "$dir/.htpasswd" "$SITE_DIR/.htpasswd"
                        echo "  ✅ Copied new .htpasswd from source"
                      elif [ -f "$SITE_DIR/.htpasswd.backup" ]; then
                        mv "$SITE_DIR/.htpasswd.backup" "$SITE_DIR/.htpasswd"
                        echo "  ↩️ Restored existing .htpasswd from backup"
                      else
                        echo "  ⚠️ No .htpasswd found (source or backup)"
                      fi
                      echo ""
                      
                      # Clean up unused backups
                      rm -f "$SITE_DIR/.htaccess.backup" "$SITE_DIR/.htpasswd.backup"
                      
                      # Final verification
                      echo "[POST-SYNC VERIFICATION]"
                      echo "Files now in $SITE_DIR:"
                      ls -lah "$SITE_DIR" | head -20
                      echo ""
                      
                      echo "Special files status:"
                      if [ -f "$SITE_DIR/.htaccess" ]; then
                        echo "  ✅ .htaccess: PRESENT"
                        echo "     Size: $(stat -f%z "$SITE_DIR/.htaccess" 2>/dev/null || stat -c%s "$SITE_DIR/.htaccess")"
                      else
                        echo "  ❌ .htaccess: MISSING"
                      fi
                      
                      if [ -f "$SITE_DIR/.htpasswd" ]; then
                        echo "  ✅ .htpasswd: PRESENT"
                        echo "     Size: $(stat -f%z "$SITE_DIR/.htpasswd" 2>/dev/null || stat -c%s "$SITE_DIR/.htpasswd")"
                      else
                        echo "  ❌ .htpasswd: MISSING"
                      fi
                      echo ""
                   fi
                done
                
                echo "════════════════════════════════════════════════════════════════"
                echo "🧹 Cleaning up temp files..."
                rm -rf $BASE/temp_uploads
                
                # Reload Web Server
                echo "🔄 Restarting shared_web container..."
                cd $BASE && docker compose -f docker-compose.yml -f docker-compose.prod.yml restart shared_web
                echo "✅ Container restarted"
                echo ""
            else
                echo "⚠️ No static site artifacts found to sync"
            fi
            
            echo "==================== ✅ SYNC OPERATIONS COMPLETE ===================="
            echo ""


  # ======================================================
  # 5. CONFIGURE PROXY
  # ======================================================
  configure-proxy:
    name: 🌐 Configure Nginx Proxy Manager
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ always() && !contains(needs.deploy.result, 'failure') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install requests urllib3

      - name: Normalize Apps JSON
        run: |
          jq '.apps |= map(if .type == "node" then .type = "static" else . end)' apps.json > apps_fixed.json && mv apps_fixed.json apps.json

      - name: 🌐 Configure NPM
        env:
          NPM_USER: ${{ secrets.NPM_USER }}
          NPM_PASS: ${{ secrets.NPM_PASS }}
          NPM_BASE_URL: "https://pm.ecapps.in"
          NPM_TIMEOUT: "120"
          APPS_FILE: "apps.json"
        run: |
          echo "🌐 Validating NPM credentials..."
          if [ -z "$NPM_USER" ]; then
            echo "❌ Error: NPM_USER secret is not set"
            exit 1
          fi
          if [ -z "$NPM_PASS" ]; then
            echo "❌ Error: NPM_PASS secret is not set"
            exit 1
          fi
          echo "✅ NPM credentials are set"
          echo "🌐 NPM URL: $NPM_BASE_URL"
          echo "🌐 Running configuration..."
          python .github/scripts/configure_npm.py 2>&1 | tee npm_config.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-npm
          path: npm_config.log
          retention-days: 7

# ======================================================
  # 6. NOTIFICATIONS
  # ======================================================
  notify:
    name: 🔔 Notify Summary
    needs: [deploy, configure-proxy]
    if: always()
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Logs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: log-*
          path: logs
          merge-multiple: true

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 🧠 Build Notification Payload
        id: builder
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PROXY_RESULT: ${{ needs.configure-proxy.result }}
        run: |
          chmod +x .github/scripts/notification_builder.py
          python .github/scripts/notification_builder.py

      - name: 📬 Send Telegram
        if: ${{ env.TELEGRAM_TOKEN != '' }}
        env:
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_TOKEN: ${{ env.TELEGRAM_TOKEN }}
          EMOJI: ${{ steps.builder.outputs.EMOJI }}
          TITLE: ${{ steps.builder.outputs.TITLE }}
          MSG: ${{ steps.builder.outputs.TELEGRAM_MSG }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d parse_mode="HTML" \
            -d text="$EMOJI <b>$TITLE</b>%0A%0A$MSG"

      - name: 📧 Send Email
        if: ${{ env.EMAIL_USER != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: ${{ steps.builder.outputs.EMOJI }} ${{ steps.builder.outputs.TITLE }} - ${{ github.repository }}
          to: ecappmakersonline@gmail.com,raajbala1999@gmail.com
          from: ${{ env.EMAIL_USER }}
          html_body: file://email_message.html
          ignore_cert: true


