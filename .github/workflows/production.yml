name: Production Build & Deploy

on:
  push:
    branches: [ "production" ]
    paths:
      - 'versions.env'
      - 'java/**'
      - 'apache/**'
      - '.github/workflows/**'
  milestone:
    types: [created]

jobs:
  build-process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. SETUP & BUILD JAVA
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'zulu'
          cache: maven
          
      - name: Build WARs
        run: |
          mkdir -p build_artifacts/wars
          for d in java/*/; do
            if [ -f "$d/pom.xml" ]; then
                app_name=$(basename "$d")
                echo "🚀 Building: $app_name"
                pushd "$d"
                mvn clean package -DskipTests
                mv target/*.war ../../build_artifacts/wars/$app_name.war
                popd
            fi
          done

      # 2. ZIP APACHE FOLDERS
      - name: Zip Apache
        run: |
          mkdir -p build_artifacts/apache_zips
          cd apache
          for d in */; do
            dirname=${d%/}
            zip -r "../build_artifacts/apache_zips/$dirname.zip" "$dirname"
          done

      # 3. UPLOAD ARTIFACTS (Milestone Only)
      - name: Upload Milestone Artifacts
        if: github.event_name == 'milestone'
        uses: actions/upload-artifact@v4
        with:
          name: milestone-release
          path: build_artifacts/**/*

      # 4. DEPLOY TO VPS
      - name: Deploy to VPS
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@master
        env:
          SITE24X7_KEY: ${{ secrets.SITE24X7_KEY }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SITE24X7_KEY,DB_ROOT_PASSWORD
          script: |
            AGENT_KEY="${SITE24X7_KEY}"
            DB_PASS="${DB_ROOT_PASSWORD}"
            BASE="/opt/ecapps-hosting"
            REPO_URL="https://github.com/ecappmakers/ecapps-production-iaas.git"
            
            # Ensure folders exist
            mkdir -p $BASE/data/{war-uploads,php-sites,mysql-data,npm-data,portainer-data,tomcat-lib}
            mkdir -p $BASE/configs/apache
            
            # ⚠️ SELF-HEALING FIX: Force delete the "directory" if it exists, then touch the file
            rm -rf $BASE/configs/apache/vhosts.conf
            touch $BASE/configs/apache/vhosts.conf
            
            cd $BASE
            # Git Sync
            if [ ! -d ".git" ]; then
                git init
                git remote add origin $REPO_URL
            fi
            git fetch origin production
            git reset --hard origin/production
            
            # Generate .env
            cat versions.env > .env
            echo "DB_ROOT_PASSWORD=$DB_PASS" >> .env
            
            # Site24x7 Check (Optional)
            if [ ! -d "/opt/site24x7/monagent" ]; then
               wget -q https://staticdownloads.site24x7.com/server/Site24x7FullStackAgent_LinuxIns.sh
               bash Site24x7FullStackAgent_LinuxIns.sh -i -key=$AGENT_KEY -automation=true -apm_insight=false
               rm Site24x7FullStackAgent_LinuxIns.sh
            fi
            
            # Reload Docker
            docker compose up -d --build

      # 5. COPY FILES TO VPS
      - name: Copy Files
        if: github.event_name == 'push'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "build_artifacts/wars/*.war,apache/*"
          target: "/opt/ecapps-hosting/temp_deploy/"

      # 6. FINAL INSTALLATION & APACHE CONFIG GENERATOR
      - name: Finalize Installation
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            BASE="/opt/ecapps-hosting"
            CONFIG_FILE="$BASE/configs/apache/vhosts.conf"
            
            # 1. Setup Config File Header
            echo "# Auto-Generated by GitHub Actions" > $CONFIG_FILE
            
            # 2. Process PHP Sites Dynamically
            for dir in $BASE/temp_deploy/apache/*/; do
                [ -d "$dir" ] || continue
                
                domain=$(basename "$dir")
                safe_name="${domain//./_}_public_html"
                
                echo "⚙️ Configuring Site: $domain -> $safe_name"
                
                # Move files
                rm -rf "$BASE/data/php-sites/$safe_name"
                mv "$dir" "$BASE/data/php-sites/$safe_name"
                
                # Write VirtualHost Block
                echo "<VirtualHost *:80>" >> $CONFIG_FILE
                echo "    ServerName $domain" >> $CONFIG_FILE
                if [ "$domain" == "ecapps.in" ]; then
                    echo "    ServerAlias www.ecapps.in" >> $CONFIG_FILE
                fi
                echo "    DocumentRoot /var/www/html/$safe_name" >> $CONFIG_FILE
                echo "    <Directory /var/www/html/$safe_name>" >> $CONFIG_FILE
                echo "        Options Indexes FollowSymLinks" >> $CONFIG_FILE
                echo "        AllowOverride All" >> $CONFIG_FILE
                echo "        Require all granted" >> $CONFIG_FILE
                echo "    </Directory>" >> $CONFIG_FILE
                echo "</VirtualHost>" >> $CONFIG_FILE
                echo "" >> $CONFIG_FILE
            done
            
            # 3. Process Tomcat WARs
            mv $BASE/temp_deploy/build_artifacts/wars/*.war $BASE/data/war-uploads/ || true
            
            # 4. Fix Permissions
            chown -R 33:33 $BASE/data/php-sites/
            chmod -R 755 $BASE/data/php-sites/
            chmod -R 755 $BASE/data/war-uploads/
            
            # 5. Reload Apache
            docker exec shared_apache apachectl -k graceful
            
            # Cleanup
            rm -rf $BASE/temp_deploy
