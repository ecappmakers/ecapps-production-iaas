name: Production Modular Pipeline

on:
  push:
    branches: [ "production" ]
    paths-ignore:
      - 'README.md'
  milestone:
    types: [created]

jobs:
  # ======================================================
  # 1. BUILD JOBS (Run in Parallel)
  # ======================================================

  build-java:
    name: ☕ Build Java (WARs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'zulu'
          cache: maven
      
      - name: Build WAR Files
        run: |
          mkdir -p artifacts/wars
          for d in java/*/; do
            if [ -f "$d/pom.xml" ]; then
                app_name=$(basename "$d")
                echo "🚀 Building: $app_name"
                pushd "$d"
                mvn clean package -DskipTests
                mv target/*.war ../../artifacts/wars/$app_name.war
                popd
            fi
          done
      
      - name: Upload Java Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: java-wars
          path: artifacts/wars
          retention-days: 1

  build-php:
    name: 🐘 Package PHP (Apache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Prepare Apache Folders
        run: |
          mkdir -p artifacts/apache
          # Copy all folders from repo 'apache/' to artifacts
          if [ -d "apache" ]; then
            cp -r apache/* artifacts/apache/
          fi
      
      - name: Upload PHP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: php-sites
          path: artifacts/apache
          retention-days: 1

  build-node:
    name: 🟢 Build Node.js (Future Proof)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Build Node Apps
        run: |
          mkdir -p artifacts/node
          # Loop through node apps if they exist (Placeholder logic)
          if [ -d "node_apps" ]; then
            for d in node_apps/*/; do
              app_name=$(basename "$d")
              echo "Building Node App: $app_name"
              cd "$d"
              npm install && npm run build
              # Zip the build folder
              zip -r ../../artifacts/node/$app_name.zip build/
              cd ../..
            done
          else
            echo "No Node apps found, skipping."
          fi

      - name: Upload Node Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-apps
          path: artifacts/node
          retention-days: 1

  # ======================================================
  # 2. DEPLOYMENT JOB (Runs after Builds)
  # ======================================================

  deploy:
    name: 🚀 Deploy to VPS
    needs: [build-java, build-php, build-node] # Waits for all builds
    runs-on: ubuntu-latest
    steps:
      # --- A. PREPARE FILES ---
      - uses: actions/checkout@v3
      
      - name: Download Java Artifacts
        uses: actions/download-artifact@v4
        with:
          name: java-wars
          path: deploy_package/wars

      - name: Download PHP Artifacts
        uses: actions/download-artifact@v4
        with:
          name: php-sites
          path: deploy_package/apache

      # --- B. INFRASTRUCTURE SETUP ---
      - name: Setup Infrastructure (Docker & Network)
        uses: appleboy/ssh-action@master
        env:
          SITE24X7_KEY: ${{ secrets.SITE24X7_KEY }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SITE24X7_KEY,DB_ROOT_PASSWORD
          script: |
            AGENT_KEY="${SITE24X7_KEY}"
            DB_PASS="${DB_ROOT_PASSWORD}"
            BASE="/opt/ecapps-hosting"
            REPO_URL="https://github.com/ecappmakers/ecapps-production-iaas.git"
            
            # 1. Structure Setup
            mkdir -p $BASE/data/{war-uploads,php-sites,mysql-data,npm-data,portainer-data,tomcat-lib}
            mkdir -p $BASE/configs/apache
            
            # 2. Self-Healing Config Fix
            rm -rf $BASE/configs/apache/vhosts.conf
            touch $BASE/configs/apache/vhosts.conf
            
            # 3. Git Infrastructure Sync
            cd $BASE
            if [ ! -d ".git" ]; then
                git init
                git remote add origin $REPO_URL
            fi
            git fetch origin production
            git reset --hard origin/production
            
            # 4. Generate Env & Monitor
            cat versions.env > .env
            echo "DB_ROOT_PASSWORD=$DB_PASS" >> .env
            
            # 5. Start/Update Containers
            docker compose up -d --build

      # --- C. COPY ARTIFACTS ---
      - name: Copy Files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy_package/wars/*.war,deploy_package/apache/*"
          target: "/opt/ecapps-hosting/temp_deploy/"

      # --- D. INSTALL & CONFIGURE ---
      - name: Finalize Installation & Auto-Config
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            BASE="/opt/ecapps-hosting"
            CONFIG_FILE="$BASE/configs/apache/vhosts.conf"
            
            echo "# Auto-Generated Apache Config" > $CONFIG_FILE
            
            # 1. Process PHP Sites (Dynamic VirtualHosts)
            # Note: Path is now 'deploy_package/apache' because of artifact download structure
            for dir in $BASE/temp_deploy/deploy_package/apache/*/; do
                [ -d "$dir" ] || continue
                domain=$(basename "$dir")
                safe_name="${domain//./_}_public_html"
                
                echo "⚙️ Configuring: $domain -> $safe_name"
                
                # Move & Clean
                rm -rf "$BASE/data/php-sites/$safe_name"
                mv "$dir" "$BASE/data/php-sites/$safe_name"
                
                # Write VHost
                echo "<VirtualHost *:80>" >> $CONFIG_FILE
                echo "    ServerName $domain" >> $CONFIG_FILE
                if [ "$domain" == "ecapps.in" ]; then
                    echo "    ServerAlias www.ecapps.in" >> $CONFIG_FILE
                fi
                echo "    DocumentRoot /var/www/html/$safe_name" >> $CONFIG_FILE
                echo "    <Directory /var/www/html/$safe_name>" >> $CONFIG_FILE
                echo "        Options Indexes FollowSymLinks" >> $CONFIG_FILE
                echo "        AllowOverride All" >> $CONFIG_FILE
                echo "        Require all granted" >> $CONFIG_FILE
                echo "    </Directory>" >> $CONFIG_FILE
                echo "</VirtualHost>" >> $CONFIG_FILE
                echo "" >> $CONFIG_FILE
            done
            
            # 2. Process Java WARs
            mv $BASE/temp_deploy/deploy_package/wars/*.war $BASE/data/war-uploads/ || true
            
            # 3. Permissions & Reload
            chown -R 33:33 $BASE/data/php-sites/
            chmod -R 755 $BASE/data/php-sites/
            chmod -R 755 $BASE/data/war-uploads/
            
            docker exec shared_apache apachectl -k graceful
            
            # Cleanup
            rm -rf $BASE/temp_deploy
