name: Production Infrastructure Pipeline

on:
  push:
    branches: [ "production" ]
    paths: [ "apps.json", ".github/workflows/**", "docker-compose.yml" ]
  workflow_dispatch:

jobs:
  # ======================================================
  # 1. PARALLEL JOBS (Code Builds + Infra Ops)
  # ======================================================

  build-java:
    name: ☕ Build Java
    runs-on: ubuntu-latest
    outputs:
      has_java: ${{ env.HAS_JAVA }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'zulu'
      - name: Process Java Apps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p artifacts/wars
          touch built_java.txt
          if jq -e '.java // [] | length > 0' apps.json > /dev/null; then
            for row in $(jq -r '.java[] | @base64' apps.json); do
                _jq() { echo ${row} | base64 --decode | jq -r "${1}"; }
                NAME=$(_jq '.name'); REPO=$(_jq '.repo_url'); BRANCH=$(_jq '.branch')
                AUTH_REPO=$(echo $REPO | sed "s/https:\/\//https:\/\/oauth2:${GH_PAT}@/")
                git clone --branch $BRANCH --single-branch $AUTH_REPO temp_java
                pushd temp_java
                mvn clean package -DskipTests
                mv target/*.war ../artifacts/wars/${NAME}.war
                popd
                rm -rf temp_java
                echo "$NAME (Java)" >> built_java.txt
            done
            echo "HAS_JAVA=true" >> $GITHUB_ENV
          else
            echo "HAS_JAVA=false" >> $GITHUB_ENV
          fi
      - name: Upload Java Artifacts
        if: env.HAS_JAVA == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: java-wars
          path: artifacts/wars
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: log-java
          path: built_java.txt

  build-php:
    name: 🐘 Package PHP
    runs-on: ubuntu-latest
    outputs:
      has_php: ${{ env.HAS_PHP }}
    steps:
      - uses: actions/checkout@v3
      - name: Process PHP Apps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p artifacts/apache
          touch built_php.txt
          if jq -e '.php // [] | length > 0' apps.json > /dev/null; then
            for row in $(jq -r '.php[] | @base64' apps.json); do
                _jq() { echo ${row} | base64 --decode | jq -r "${1}"; }
                NAME=$(_jq '.name'); REPO=$(_jq '.repo_url'); BRANCH=$(_jq '.branch')
                AUTH_REPO=$(echo $REPO | sed "s/https:\/\//https:\/\/oauth2:${GH_PAT}@/")
                git clone --branch $BRANCH --single-branch $AUTH_REPO artifacts/apache/${NAME}
                rm -rf artifacts/apache/${NAME}/.git
                echo "$NAME (PHP)" >> built_php.txt
            done
            echo "HAS_PHP=true" >> $GITHUB_ENV
          else
            echo "HAS_PHP=false" >> $GITHUB_ENV
          fi
      - name: Upload PHP Artifacts
        if: env.HAS_PHP == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: php-sites
          path: artifacts/apache
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: log-php
          path: built_php.txt

  build-node:
    name: 🟢 Build Node.js
    runs-on: ubuntu-latest
    outputs:
      has_node: ${{ env.HAS_NODE }}
    steps:
      - uses: checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Process Node Apps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p artifacts/node_to_apache
          touch built_node.txt
          if jq -e '.node // [] | length > 0' apps.json > /dev/null; then
            for row in $(jq -r '.node[] | @base64' apps.json); do
                _jq() { echo ${row} | base64 --decode | jq -r "${1}"; }
                NAME=$(_jq '.name'); REPO=$(_jq '.repo_url'); BRANCH=$(_jq '.branch'); OUT_DIR=$(_jq '.output_dir // "build"')
                AUTH_REPO=$(echo $REPO | sed "s/https:\/\//https:\/\/oauth2:${GH_PAT}@/")
                git clone --branch $BRANCH --single-branch $AUTH_REPO temp_node
                pushd temp_node
                npm install && npm run build
                mv "$OUT_DIR" ../artifacts/node_to_apache/${NAME}
                popd
                rm -rf temp_node
                echo "$NAME (Node)" >> built_node.txt
            done
            echo "HAS_NODE=true" >> $GITHUB_ENV
          else
            echo "HAS_NODE=false" >> $GITHUB_ENV
          fi
      - name: Upload Node Artifacts
        if: env.HAS_NODE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: node-sites
          path: artifacts/node_to_apache
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: log-node
          path: built_node.txt

  infra-ops:
    name: 🔧 Infra Ops
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH & Maintenance
        uses: appleboy/ssh-action@master
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_ROOT_PASSWORD
          script: |
            BASE="/opt/ecapps-hosting"
            BACKUP_DIR="$BASE/backups"
            DATE=$(date +%Y-%m-%d_%H%M)
            mkdir -p $BACKUP_DIR $BASE/data/{war-uploads,php-sites,mysql-data,npm-data,portainer-data,tomcat-lib} $BASE/configs/apache
            if [ -d "$BASE/data/mysql-data" ] && docker ps | grep -q main_db; then
                docker exec main_db mysqldump -u root --password=$DB_ROOT_PASSWORD --all-databases > $BACKUP_DIR/db_backup_$DATE.sql
                gzip $BACKUP_DIR/db_backup_$DATE.sql
                find $BACKUP_DIR -name "*.sql.gz" -mtime +7 -exec rm {} \;
            fi
            cd $BASE
            git fetch origin production && git reset --hard origin/production
            docker compose pull --quiet
            docker system prune -f

  # ======================================================
  # 2. DEPLOY JOB (Using Job Outputs for Safety)
  # ======================================================

  deploy:
    name: 🚀 Deploy to VPS
    needs: [build-java, build-php, build-node, infra-ops]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 🛡️ Step-level Shell logic to check apps.json (Works everywhere)
      - name: Download Java
        run: |
          if jq -e '.java // [] | length > 0' apps.json > /dev/null; then
             echo "Fetching Java artifacts..."
          else
             echo "SKIP=true" >> $GITHUB_ENV
          fi
      - uses: actions/download-artifact@v4
        if: env.SKIP != 'true'
        with:
          name: java-wars
          path: deploy_package/wars

      - name: Download PHP
        run: |
          if jq -e '.php // [] | length > 0' apps.json > /dev/null; then
             echo "Fetching PHP artifacts..."
          else
             echo "SKIP_PHP=true" >> $GITHUB_ENV
          fi
      - uses: actions/download-artifact@v4
        if: env.SKIP_PHP != 'true'
        with:
          name: php-sites
          path: deploy_package/apache

      - name: Download Node
        run: |
          if jq -e '.node // [] | length > 0' apps.json > /dev/null; then
             echo "Fetching Node artifacts..."
          else
             echo "SKIP_NODE=true" >> $GITHUB_ENV
          fi
      - uses: actions/download-artifact@v4
        if: env.SKIP_NODE != 'true'
        with:
          name: node-sites
          path: deploy_package/apache

      - uses: actions/download-artifact@v4
        with: { name: log-java, path: logs }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: log-php, path: logs }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: log-node, path: logs }
        continue-on-error: true

      - name: Restart Infrastructure
        uses: appleboy/ssh-action@master
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_ROOT_PASSWORD
          script: |
            BASE="/opt/ecapps-hosting"
            rm -rf $BASE/temp_deploy $BASE/configs/apache/vhosts.conf
            touch $BASE/configs/apache/vhosts.conf
            cd $BASE
            cat versions.env > .env
            echo "DB_ROOT_PASSWORD=$DB_ROOT_PASSWORD" >> .env
            docker compose up -d

      - name: Copy Files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy_package/"
          target: "/opt/ecapps-hosting/temp_deploy/"

      - name: Finalize Installation
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            BASE="/opt/ecapps-hosting"
            CONFIG_FILE="$BASE/configs/apache/vhosts.conf"
            echo "# Auto-Generated Config" > $CONFIG_FILE
            rm -rf $BASE/data/php-sites/*
            if [ -d "$BASE/temp_deploy/deploy_package/apache" ]; then
                for dir in $BASE/temp_deploy/deploy_package/apache/*/; do
                    [ -d "$dir" ] || continue
                    domain=$(basename "$dir")
                    safe_name="${domain//./_}_public_html"
                    mv "$dir" "$BASE/data/php-sites/$safe_name"
                    echo "<VirtualHost *:80>" >> $CONFIG_FILE
                    echo "    ServerName $domain" >> $CONFIG_FILE
                    [ "$domain" == "ecapps.in" ] && echo "    ServerAlias www.ecapps.in" >> $CONFIG_FILE
                    echo "    DocumentRoot /var/www/html/$safe_name" >> $CONFIG_FILE
                    echo "    <Directory /var/www/html/$safe_name>" >> $CONFIG_FILE
                    echo "        Options Indexes FollowSymLinks" >> $CONFIG_FILE
                    echo "        AllowOverride All" >> $CONFIG_FILE
                    echo "        Require all granted" >> $CONFIG_FILE
                    echo "    </Directory>" >> $CONFIG_FILE
                    echo "</VirtualHost>" >> $CONFIG_FILE
                    echo "" >> $CONFIG_FILE
                done
            fi
            if [ -d "$BASE/temp_deploy/deploy_package/wars" ]; then
                mv $BASE/temp_deploy/deploy_package/wars/*.war $BASE/data/war-uploads/ || true
            fi
            chown -R 33:33 $BASE/data/php-sites/
            chmod -R 755 $BASE/data/php-sites/ $BASE/data/war-uploads/
            docker restart shared_apache
            rm -rf $BASE/temp_deploy

  # ======================================================
  # 3. NOTIFICATION JOB
  # ======================================================

  notify:
    name: 🔔 Notify Telegram
    needs: [deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: log-java, path: logs }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: log-php, path: logs }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: log-node, path: logs }
        continue-on-error: true

      - name: Broadcast Message
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
        run: |
          if [ "$DEPLOY_STATUS" == "success" ]; then
            EMOJI="✅"; TITLE="Deployment Successful"; MESSAGE="<b>Updated Apps:</b>"
            if ls logs/*.txt 1> /dev/null 2>&1; then 
                cat logs/*.txt > all_apps.txt
                while IFS= read -r line; do
                    [[ -z "${line// }" ]] && continue
                    MESSAGE+="%0A• $line"
                done < all_apps.txt
            else 
                MESSAGE+="%0A(Infrastructure Update Only)"
            fi
          else
            EMOJI="❌"; TITLE="Deployment Failed"; MESSAGE="⚠️ <b>Error:</b> Check GitHub Actions logs."
          fi
          FINAL_MSG="$EMOJI <b>$TITLE</b>%0A%0A$MESSAGE"
          UPDATES=$(curl -s "https://api.telegram.org/bot$BOT_TOKEN/getUpdates")
          CHAT_IDS=$(echo "$UPDATES" | jq -r '.result[].message.chat.id' | sort -u)
          if [ -z "$CHAT_IDS" ] || [ "$CHAT_IDS" == "null" ]; then
             echo "⚠️ No active subscribers found."
          else
             for id in $CHAT_IDS; do
                curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
                  -d chat_id="$id" -d parse_mode="HTML" -d text="$FINAL_MSG"
             done
          fi
