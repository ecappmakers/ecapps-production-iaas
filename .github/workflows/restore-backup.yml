name: 🔄 Advanced Database Restore

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: '⚠️ TYPE "RESTORE" TO CONFIRM'
        required: true
        default: 'NO'
      target_db:
        description: '🎯 Database Name (Type "ALL" for full restore, or specific name e.g., "users_db")'
        required: true
        default: 'ALL'
      backup_date:
        description: '📅 Date (Type "LATEST" or "YYYY-MM-DD")'
        required: true
        default: 'LATEST'

jobs:
  restore:
    name: 🚨 Restore ${{ inputs.target_db }}
    runs-on: ubuntu-latest
    if: ${{ inputs.confirmation == 'RESTORE' }}
    
    steps:
      # 1. Setup Environment
      - name: ⚙️ Setup Tools
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone ~/.ssh
          echo "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      # 2. Find Specific Backup File
      - name: 🔍 Find Backup File
        id: finder
        env:
          DATE_INPUT: ${{ inputs.backup_date }}
        run: |
          set -euo pipefail
          REMOTE_PATH="gdrive:/VPS_Backups/MySQL"
          
          if [ "$DATE_INPUT" == "LATEST" ]; then
             echo "🔵 Searching for LATEST backup..."
             # Sorts by name (date) and picks last
             FILE=$(rclone lsf "$REMOTE_PATH" --files-only | sort | tail -n 1)
          else
             echo "🔵 Searching for backup from date: $DATE_INPUT..."
             # Filters files matching the date pattern
             FILE=$(rclone lsf "$REMOTE_PATH" --files-only --include "*$DATE_INPUT*" | sort | tail -n 1)
          fi

          if [ -z "$FILE" ]; then
            echo "❌ Error: No backup found for request '$DATE_INPUT'"
            exit 1
          fi

          echo "✅ Found file: $FILE"
          echo "backup_file=$FILE" >> $GITHUB_ENV

          # Download logic
          echo "⏳ Downloading to runner..."
          rclone copy "$REMOTE_PATH/$FILE" ./

      # 3. Intelligent Restore
      - name: 🚀 Streaming Restore
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DB_PASS: ${{ secrets.DB_ROOT_PASSWORD }}
          TARGET_DB: ${{ inputs.target_db }}
          FILE_NAME: ${{ env.backup_file }}
        run: |
          set -euo pipefail
          REMOTE_DIR="/opt/ecapps-hosting/restore_temp"
          
          echo "🔵 Uploading $FILE_NAME to VPS..."
          ssh -i ~/.ssh/id_rsa "$VPS_USER@$VPS_HOST" "mkdir -p $REMOTE_DIR"
          scp -i ~/.ssh/id_rsa "$FILE_NAME" "$VPS_USER@$VPS_HOST:$REMOTE_DIR/"

          echo "⚙️ Constructing Restore Command..."
          
          # Logic to determine command
          if [ "$TARGET_DB" == "ALL" ]; then
             echo "⚠️  MODE: FULL SERVER RESTORE (All Databases)"
             # Standard restore command
             MYSQL_CMD="mysql -u root -p'$DB_PASS'"
          else
             echo "🎯 MODE: SINGLE DATABASE RESTORE ($TARGET_DB)"
             # -o flag filters the dump to only apply to the specific DB
             MYSQL_CMD="mysql -u root -p'$DB_PASS' --one-database $TARGET_DB"
          fi

          echo "⏳ Executing Restore on VPS..."
          ssh -i ~/.ssh/id_rsa "$VPS_USER@$VPS_HOST" << EOF
            set -e
            
            # 1. If restoring specific DB, ensure it exists first
            if [ "$TARGET_DB" != "ALL" ]; then
               echo "Checking if database $TARGET_DB exists..."
               docker exec -i main_db mysql -u root -p'$DB_PASS' -e "CREATE DATABASE IF NOT EXISTS $TARGET_DB;"
            fi

            # 2. Pipe file into Docker -> MySQL
            echo "Importing..."
            zcat "$REMOTE_DIR/$FILE_NAME" | docker exec -i main_db $MYSQL_CMD
            
            # 3. Cleanup
            rm -f "$REMOTE_DIR/$FILE_NAME"
            echo "✅ Restore Complete"
          EOF

      # 4. Telegram Notification
      - name: 📱 Telegram Report
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          DB_NAME: ${{ inputs.target_db }}
          FILE: ${{ env.backup_file }}
        run: |
          if [ "$STATUS" == "success" ]; then
            MSG="✅ <b>Restore Success</b>%0Adb: <code>$DB_NAME</code>%0Afrom: <code>$FILE</code>"
          else
            MSG="❌ <b>Restore Failed</b>%0ACheck Logs."
          fi
          
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" -d parse_mode="HTML" -d text="$MSG"
