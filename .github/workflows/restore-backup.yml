name: 🔄 Database Restore

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: '⚠️ DANGER: Type "RESTORE" to confirm overwriting the database.'
        required: true
        default: 'NO'
      target_db:
        description: '🎯 Database Name (Type "ALL" for full restore, or specific name e.g., "users_db")'
        required: true
        default: 'ALL'
      backup_date:
        description: '📅 Date (Type "LATEST" or "YYYY-MM-DD")'
        required: true
        default: 'LATEST'

jobs:
  restore:
    name: 🚨 Restore ${{ inputs.target_db }}
    runs-on: ubuntu-latest
    if: ${{ inputs.confirmation == 'RESTORE' }}
    
    steps:
      # 1. Setup Environment (Install Rclone & Configure SSH)
      - name: ⚙️ Setup Tools
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          
          echo "⬇️ Installing Rclone..."
          # Fix: Explicitly install rclone so we can use the command
          sudo -v ; curl https://rclone.org/install.sh | sudo bash

          echo "⚙️ Configuring Rclone..."
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

          echo "🔑 Configuring SSH..."
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      # 2. Find and Download Backup File
      - name: 🔍 Find Backup File
        id: finder
        env:
          DATE_INPUT: ${{ inputs.backup_date }}
        run: |
          set -euo pipefail
          REMOTE_PATH="gdrive:/VPS_Backups/MySQL"
          
          if [ "$DATE_INPUT" == "LATEST" ]; then
             echo "🔵 Searching for LATEST backup..."
             # List files, sort by date/name, pick the last one
             FILE=$(rclone lsf "$REMOTE_PATH" --files-only | sort | tail -n 1)
          else
             echo "🔵 Searching for backup matching date: $DATE_INPUT..."
             FILE=$(rclone lsf "$REMOTE_PATH" --files-only --include "*$DATE_INPUT*" | sort | tail -n 1)
          fi

          if [ -z "$FILE" ]; then
            echo "❌ Error: No backup file found matching your criteria."
            exit 1
          fi

          echo "✅ Found file: $FILE"
          echo "backup_file=$FILE" >> $GITHUB_ENV

          echo "⏳ Downloading file to runner..."
          rclone copy "$REMOTE_PATH/$FILE" ./
          ls -lh "$FILE"

      # 3. Transfer and Restore on VPS
      - name: 🚀 Transfer & Restore
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DB_PASS: ${{ secrets.DB_ROOT_PASSWORD }}
          TARGET_DB: ${{ inputs.target_db }}
          FILE_NAME: ${{ env.backup_file }}
        run: |
          set -euo pipefail
          REMOTE_DIR="/opt/ecapps-hosting/restore_temp"
          
          echo "🔵 Uploading $FILE_NAME to VPS..."
          ssh -i ~/.ssh/id_rsa "$VPS_USER@$VPS_HOST" "mkdir -p $REMOTE_DIR"
          scp -i ~/.ssh/id_rsa "$FILE_NAME" "$VPS_USER@$VPS_HOST:$REMOTE_DIR/"

          echo "⚙️ Configuring Restore Command..."
          
          # Determine if we are restoring ALL databases or just ONE
          if [ "$TARGET_DB" == "ALL" ]; then
             echo "⚠️  MODE: FULL SERVER RESTORE (All Databases)"
             MYSQL_CMD="mysql -u root -p'$DB_PASS'"
          else
             echo "🎯 MODE: SINGLE DATABASE RESTORE ($TARGET_DB)"
             # The --one-database flag ignores SQL statements for other DBs
             MYSQL_CMD="mysql -u root -p'$DB_PASS' --one-database $TARGET_DB"
          fi

          echo "⏳ Executing Restore on VPS..."
          ssh -i ~/.ssh/id_rsa "$VPS_USER@$VPS_HOST" << EOF
            set -e
            
            # 1. Create DB if it doesn't exist (only for single DB mode)
            if [ "$TARGET_DB" != "ALL" ]; then
               echo "Checking database existence..."
               docker exec -i main_db mysql -u root -p'$DB_PASS' -e "CREATE DATABASE IF NOT EXISTS $TARGET_DB;"
            fi

            # 2. Unzip and Pipe into Docker
            echo "Importing SQL Dump..."
            zcat "$REMOTE_DIR/$FILE_NAME" | docker exec -i main_db $MYSQL_CMD
            
            # 3. Cleanup
            echo "Cleaning up temp files..."
            rm -f "$REMOTE_DIR/$FILE_NAME"
            
            echo "✅ Database restore completed successfully."
          EOF

      # 4. Telegram Notification
      - name: 📱 Telegram Notification
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          DB_NAME: ${{ inputs.target_db }}
          FILE: ${{ env.backup_file }}
        run: |
          if [ "$STATUS" == "success" ]; then
            ICON="✅"
            HEADER="Restore Successful"
            MSG="Restored <b>$DB_NAME</b> from backup file <code>$FILE</code>."
          else
            ICON="❌"
            HEADER="Restore Failed"
            MSG="The restore process failed. Check GitHub Actions logs."
          fi

          TEXT="<b>$ICON $HEADER</b>%0A"
          TEXT="${TEXT}──────────────────%0A"
          TEXT="${TEXT}<b>📂 Repo:</b> ${{ github.repository }}%0A"
          TEXT="${TEXT}<b>📅 Time:</b> $(date '+%H:%M:%S UTC')%0A"
          TEXT="${TEXT}──────────────────%0A"
          TEXT="${TEXT}$MSG"

          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d parse_mode="HTML" \
            -d text="$TEXT"
